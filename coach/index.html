<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Клиенти · треньор</title>
<!-- ЧЕРНОВА (Т5, 08.11.2026): изгледът на треньора. Вход с Supabase Auth → списък → клиентът се отваря в ../app/?c=<client_id>.
     Зависи от tools/app/sql/coach_proposal.sql (ПРЕДЛОЖЕНИЕ, още не е приложено) — на живо днес входът минава, но списъкът няма откъде да дойде. -->
<meta name="theme-color" content="#5f6b78">
<!-- Т17: инсталиране. Тук няма токен в линка (входът е акаунт) → manifest-ът стои направо в HTML-а и за iOS.
     ИМЕТО е на ЕДНО място: manifest.webmanifest; за iOS short_name се чете оттам в apple-mobile-web-app-title. -->
<link rel="manifest" href="manifest.webmanifest" id="mfLink">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(function () {
  try {
    var x = new XMLHttpRequest();
    x.open("GET", document.getElementById("mfLink").getAttribute("href"));
    x.onload = function () {
      try {
        var m = JSON.parse(x.responseText), meta = document.createElement("meta");
        meta.name = "apple-mobile-web-app-title"; meta.content = m.short_name || m.name;
        document.head.appendChild(meta);
      } catch (e) {}
    };
    x.send();
  } catch (e) {}
})();
</script>
<style>
  /* Т21: изгледът на треньора е сив (сивото на старата лента), не зелен като клиентската страница */
  :root { --bg: #f4f6f8; --card: #fff; --ink: #1c2733; --muted: #6b7886; --accent: #5f6b78; --accent-dark: #4b5866; --gold: #b8862f; --border: #d8dee5; --soft: #eef0f2; --warn: #a0701c; --slate: #2b3540; }
  * { box-sizing: border-box; }
  body::before { content: ""; display: block; height: env(safe-area-inset-top, 0px); background: #1a1c3e; }   /* iPhone, инсталирано: под часовника */
  /* Т18: мястото на скролбара е запазено винаги (Windows/компютър). Иначе при смяна на бутон или отваряне на акордеон страницата
     минава от „по-къса от екрана“ към „по-дълга“, скролбарът (15 px) се появява/изчезва и колоната прескача с 7,5 px — „премигването“.
     На телефона скролбарът е върху съдържанието → тук няма ефект. Стар браузър без scrollbar-gutter → винаги видим скролбар. */
  html { -webkit-text-size-adjust: 100%; background: #e8ecef; scrollbar-gutter: stable; }
  @supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
  body { font-variant-numeric: tabular-nums; margin: 0 auto; max-width: 480px; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.5; overflow-x: hidden; }
  @media (min-width: 481px) { body { box-shadow: 0 0 0 1px var(--border), 0 8px 32px rgba(28,39,51,0.10); } }
  /* Т19: шапката на треньора — [←]  заглавие  [Изход]; страничните колони са еднакво широки → заглавието е точно в средата */
  header.h3 { display: grid; grid-template-columns: 90px minmax(0, 1fr) 90px; align-items: center; column-gap: 8px; padding: 8px 12px; }
  header.h3 > .hmid { min-width: 0; }
  header.h3 h1, header.h3 p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { box-sizing: border-box; height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.6); border-radius: 10px; background: transparent; color: #fff; font: inherit; font-size: 14px; font-weight: 700; line-height: 1; text-decoration: none; cursor: pointer; }
  .hbtn:hover, .hbtn:active { background: rgba(255,255,255,0.14); }
  .hbtn.back { justify-self: start; width: 36px; padding: 0; font-size: 19px; }
  .hbtn.out { justify-self: end; }
  .hsp { justify-self: start; width: 36px; height: 36px; }
  @media (max-width: 359px) { header.h3 { grid-template-columns: 36px minmax(0, 1fr) 36px; } .hbtn.out { width: 36px; padding: 0; } .hbtn.out span { display: none; } }
  header { background: var(--accent); color: #fff; padding: 12px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 19px; line-height: 1.3; }
  header p { margin: 0; font-size: 14px; opacity: 0.92; }
  .wrap { padding: 0 14px 30px; }
  .state { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 18px; margin: 22px 0; text-align: center; color: var(--muted); font-size: 15px; }
  .hidden { display: none !important; }

  /* вход */
  .login { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 22px 0; }
  .login h2 { margin: 0 0 4px; font-size: 18px; }
  .login p.sub { margin: 0 0 6px; color: var(--muted); font-size: 13.5px; }
  .login label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  .login input { width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 9px; font-family: inherit; color: var(--ink); background: #fff; }
  .btn { display: block; width: 100%; margin-top: 14px; padding: 13px; font-size: 16px; font-weight: 700; color: #fff; background: var(--accent); border: none; border-radius: 10px; cursor: pointer; font-family: inherit; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .err { display: none; margin-top: 10px; padding: 9px 12px; border-radius: 9px; background: #fdecec; border: 1px solid #f3c2c2; color: #9a3b3b; font-size: 14px; text-align: center; }
  .err.show { display: block; }

  /* списъкът */
  .tools { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; margin: 14px 0 10px; }
  /* Т76б → Т78 (Chris 23:16): броят е бутон „всички“ — с „Активни“ един избор (като радио); избраният е тъмносив (.on) */
  .tools .cnt { min-width: 2.6em; padding-left: 9px; padding-right: 9px; text-align: center; }
  .chipbtn { flex: none; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .chipbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Т53/Т54 → Т76б: „(N) [Активни (N)] [Тестови · N]“ — ВИНАГИ на един ред (320 / 375 / широко); „Тестови“ — вдясно.
     При теснота се свиват отстъпите (под 400 и под 360 px), не се пренася. */
  .tools > .chipbtn:last-child { margin-left: auto; }
  @media (max-width: 399px) { .tools { column-gap: 6px; } .tools > .chipbtn { padding-left: 8px; padding-right: 8px; } }
  @media (max-width: 359px) { .tools { column-gap: 4px; } .tools > .chipbtn { padding-left: 6px; padding-right: 6px; } }
  .row { display: block; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 12px; padding: 11px 13px; margin: 0 0 10px; color: var(--ink); text-decoration: none; }
  .row.new { border-left-color: #e0821e; }
  /* Т77 (Chris 10.11 22:17): клиент с ново от последното отваряне — светла вълна през цялата карта (~1,8 s, непрекъснато), докато не го
     отвориш. Само фонът (под текста). „Без движение“ (prefers-reduced-motion) → лек неподвижен отблясък. Същото като в app/ при треньора. */
  .shim { background-image: linear-gradient(100deg, rgba(120,140,165,0) 35%, rgba(120,140,165,0.22) 50%, rgba(120,140,165,0) 65%) !important; background-size: 300% 100% !important; background-repeat: no-repeat !important; animation: shimw 1.8s linear infinite; }
  @keyframes shimw { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  @media (prefers-reduced-motion: reduce) { .shim { animation: none; background-image: linear-gradient(100deg, rgba(120,140,165,0.16), rgba(120,140,165,0.05)) !important; background-size: 100% 100% !important; } }
  .row .l1 { display: flex; align-items: baseline; gap: 8px; }
  .row .nm { flex: 0 1 auto; min-width: 0; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* Т76: чиповете — веднага след името; при теснота отстъпва името (…) */
  /* Т76 (Chris 22:09–22:10): часът на последната активност — закотвен горе вдясно, до ръбовете на картата (≈ 6 px отгоре, 8 px отдясно), дребен.
     Остава в реда (не absolute) → мястото му е запазено: името и чиповете не влизат под него, а при теснота се съкращават те. Редът с името не слиза. */
  .row .when { flex: none; align-self: flex-start; margin: -5px -5px 0 auto; color: var(--muted); font-size: 11.5px; line-height: 1.25; white-space: nowrap; }
  .row .dev { flex: none; padding: 0 7px; border-radius: 6px; background: #e7eaee; color: #4b5866; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; }
  /* Т76: етапът („Режим“, „Анализ“, „21 дни · ден N“, „Свободен лог“) и „Личен“ — малки сиви чипове до името */
  .row .stg { flex: none; max-width: 9em; padding: 0 7px; border-radius: 6px; background: var(--soft); color: #4b5866; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Т76 (Chris 22:09): часът на последната активност е винаги в ъгъла, цял, на първия ред — при теснота се съкращават чипът и името, не той */
  .row .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .row .b { padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .row .b.msg { background: #e0821e; color: #fff; }
  .row .b.ans { background: #fbf0dc; color: var(--warn); }
  .row .b.lab { background: #e7eef8; color: #2f5f8f; }
  /* Т30 → Т76: мрежа с неподвижни колони — едно и също поле е на едно и също място във всяка карта (числата едно под друго).
     Т76в: две колони на всички ширини — [Лог][· последно] / [тегло ↑↓][· дни · т · х] / [Логнато][· Изядох · ккал] / [Вчера ккал][· 7 д ≈] / [Форма].
     Дясната колона започва с „·“; липсващ ред не заема място. */
  .row .l2 { display: grid; grid-template-columns: 8.4em minmax(0, 1fr); grid-template-areas: "lg lf" "ma mb" "ta tb" "na nb" "fm fm"; column-gap: 8px; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .row .l2 > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Т76в: дясната клетка (започва с „·“) при теснота се пренася само пред точка — етикетът и стойността му остават заедно (неразделим интервал) */
  .row .l2 > .c2, .row .l2 > .c4, .row .l2 > .t2, .row .l2 > .n2, .row .l2 > .fm { white-space: normal; text-overflow: clip; }
  .row .l2 .g { white-space: nowrap; }   /* „· етикет стойност“ — една група, не се къса; пренася се само между групите */
  .row .l2 .c1 { grid-area: lg; } .row .l2 .c2 { grid-area: lf; } .row .l2 .c3 { grid-area: ma; } .row .l2 .c4 { grid-area: mb; }
  .row .l2 .t1 { grid-area: ta; } .row .l2 .t2 { grid-area: tb; } .row .l2 .n1 { grid-area: na; } .row .l2 .n2 { grid-area: nb; } .row .l2 .fm { grid-area: fm; }
  .row .l2 .n { display: inline-block; min-width: 2ch; text-align: right; }   /* числото в слот с неподвижна ширина, подравнено вдясно */
  .row .l2 .n.w4 { min-width: 4ch; } .row .l2 .n.w5 { min-width: 5ch; }
  .row .l2 .lb { display: inline-block; min-width: 3.1em; }   /* „Вчера“ / „ДД.ММ“ — ккал едно под друго */
  .row .l2 b, .row .pv .pm b { color: var(--accent-dark); font-weight: 700; }   /* Т76в: всички стойности — болд; етикетите — не */
  /* Т76в (Chris 22:41 „да се знае кое къде свършва“): едра болд „·“ между отделните неща (и между колоните), не между етикет и стойност */
  .row .l2 .sp, .row .pv .sp, .row .sg .sp { font-size: 1.4em; font-weight: 800; line-height: 0; vertical-align: -0.1em; }
  /* Т46: разликата в теглото — нагоре червено, надолу зелено (семантично, както в app/); „=“ — сиво */
  .row .l2 .dl { font-weight: 700; } .row .l2 .dl.dup { color: #c43d3d; } .row .l2 .dl.ddown { color: #2e7d5b; }
  .row .pv { display: flex; gap: 5px; margin-top: 4px; color: #46525e; font-size: 13.5px; overflow: hidden; white-space: nowrap; }
  .row .pv .pt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .pv .pm { flex: none; color: var(--muted); font-size: 12.5px; }
  .row .pv .wt { color: #8a5f14; font-weight: 400; }   /* Т76в (Chris 22:43): в реда на съобщението болд са само датата и часът */   /* по-тъмното от --warn: контраст ≥ 4,5 на бяло (дребен текст) */
  .row .sg { margin-top: 2px; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sg .fl { color: #8a5f14; }
  /* Т53/Т54: тестовите редове (DEV, ТЕСТ, ЧЕРНОВА) — приглушени, за да личи изгледът (светъл фон, пунктир; текстът остава ≥ 4,5:1) */
  .row.ps { background: #f6f7f9; border-style: dashed; border-left-style: solid; }
  .row.ps .nm { color: #46525e; font-weight: 600; }
  .row.ps .when, .row.ps .l2 { color: #5f6b78; }
</style>
</head>
<body>
<header class="h3"><span class="hsp" aria-hidden="true"></span><div class="hmid"><h1 id="ttl">Клиенти</h1><p id="sub">&nbsp;</p></div><button type="button" class="hbtn out" id="outBtn" aria-label="Изход" title="Изход" style="display:none"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg><span>Изход</span></button></header>

<div class="wrap">
  <div class="state" id="loading">Зарежда…</div>

  <form class="login hidden" id="login" autocomplete="on" novalidate>
    <h2>Вход за треньора</h2>
    <label for="em">Имейл</label>
    <input type="email" id="em" autocomplete="username" inputmode="email" required>
    <label for="pw">Парола</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button type="submit" class="btn" id="inBtn">Влез</button>
    <div class="err" id="inErr"></div>
  </form>

  <div class="hidden" id="list">
    <div class="tools"><button type="button" class="chipbtn cnt" id="cnt" aria-pressed="true"></button><button type="button" class="chipbtn" id="actBtn" aria-pressed="false">Активни</button><button type="button" class="chipbtn hidden" id="psBtn" aria-pressed="false" aria-controls="rows">Тестови</button></div>
    <div id="rows"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SB_URL = "https://ankqnxqxrhonlffhxabn.supabase.co";
  var SB_KEY = "sb_publishable_4UGeheRP-noXzmxP5tuthg_dfeeMPDd";
  // Сесията се помни (supabase-js → localStorage) и важи и за ../app/ (същият произход, същият проект).
  var sb = window.supabase.createClient(SB_URL, SB_KEY);
  var APP_URL = window.CDB_APP_URL || "../app/";
  var LOG_TARGET = 21;                       // същият праг като в tools/app (модел Victus)
  var PSEUDO_KEY = "coach_show_pseudo";      // Т53/Т54: изгледът „Тестови“ включен на това устройство
  var ACTIVE_KEY = "coach_only_active";      // Т76: „Активни“ включен на това устройство
  var ACTIVE_DAYS = 7;                       // Т76: активност до седмица назад (днес и 7-те дни преди него)

  var $ = function (id) { return document.getElementById(id); };
  var loading = $("loading"), login = $("login"), list = $("list"), rowsEl = $("rows"), outBtn = $("outBtn"), psBtn = $("psBtn"), actBtn = $("actBtn");
  var ROWS = [];

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  function sofiaDay(ts) { try { return new Date(ts).toLocaleDateString("en-CA", { timeZone: "Europe/Sofia" }); } catch (e) { return String(ts || "").slice(0, 10); } }
  function todayStr() { return sofiaDay(new Date().toISOString()); }
  function dayDiff(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
  function ddmm(d) { var p = String(d || "").slice(0, 10).split("-"); return p.length === 3 ? p[2] + "." + p[1] : ""; }
  function hm(ts) { try { return new Date(ts).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Europe/Sofia" }); } catch (e) { return ""; } }
  function when(ts) {
    if (!ts) return "";
    var d = sofiaDay(ts), n = dayDiff(d, todayStr());
    return n === 0 ? "днес " + hm(ts) : n === 1 ? "вчера " + hm(ts) : ddmm(d);
  }
  function show(view) {
    loading.classList.toggle("hidden", view !== "loading");
    login.classList.toggle("hidden", view !== "login");
    list.classList.toggle("hidden", view !== "list");
    outBtn.style.display = view === "list" || view === "denied" ? "" : "none";
    $("sub").textContent = view === "login" ? "вход" : view === "list" ? "изглед на треньора" : " ";
  }
  function state(msg) { loading.textContent = msg; show("loading"); }

  // ── вход ──
  login.addEventListener("submit", function (e) {
    e.preventDefault();
    var em = $("em").value.trim(), pw = $("pw").value, err = $("inErr"), btn = $("inBtn");
    err.classList.remove("show");
    if (!em || !pw) { err.textContent = "Попълни имейл и парола."; err.classList.add("show"); return; }
    btn.disabled = true; btn.textContent = "Влизане…";
    sb.auth.signInWithPassword({ email: em, password: pw }).then(function (res) {
      btn.disabled = false; btn.textContent = "Влез";
      if (res.error || !res.data || !res.data.session) {
        err.textContent = /invalid|credentials/i.test(String(res.error && res.error.message)) ? "Грешен имейл или парола." : "Входът не успя. Опитай пак.";
        err.classList.add("show"); return;
      }
      $("pw").value = "";
      loadList();
    }, function () { btn.disabled = false; btn.textContent = "Влез"; err.textContent = "Няма връзка. Опитай пак."; err.classList.add("show"); });
  });
  outBtn.addEventListener("click", function () {
    sb.auth.signOut().then(function () { ROWS = []; rowsEl.innerHTML = ""; show("login"); }, function () { show("login"); });
  });

  // ── списъкът ──
  function isNew(r) { return (r.unread_msgs || 0) > 0 || (r.unread_answers || 0) > 0 || (r.pending_labs || 0) > 0; }
  // Т53/Т54 (09.11.2026, Chris 10:53 / 11:21): тестов = DEV, „(не е клиент)“ (черновата на страница за някого) или „(ТЕСТ)“ (демо фикстура) в името.
  //   „Тестови · N“ превключва изгледа: изключен → само истинските („N клиента“), включен → само тестовите („N тестови“). Никога смесено.
  function isPseudo(r) { var n = String(r.name || ""); return !!r.is_dev || n.indexOf("(не е клиент)") > -1 || n.indexOf("(ТЕСТ)") > -1; }
  // Т77: „ново“ за вълната = активност след последното отваряне на клиента от треньора на това устройство (coach_seen_at_<id> — пише го
  //   app/ при отваряне и списъкът при натискане). Без такъв запис: последното влизане в раздел (coach_seen_<раздел>_<id>), иначе — isNew.
  var SEEN_AT = "coach_seen_at_";
  function openedAt(id) {
    var t = Date.parse(lsGet(SEEN_AT + id) || "") || 0;
    if (!t) ["hrana", "merki", "danni"].forEach(function (k) { t = Math.max(t, Date.parse(lsGet("coach_seen_" + k + "_" + id) || "") || 0); });
    return t;
  }
  function shimRow(r) { var at = openedAt(r.client_id); return at ? (Date.parse(r.last_activity || "") || 0) > at : isNew(r); }
  // Т76: активен = last_activity днес или до 7 дни назад (по деня в София)
  function isActive(r) { return !!r.last_activity && dayDiff(sofiaDay(r.last_activity), todayStr()) <= ACTIVE_DAYS; }
  function num1(v) { return Number(v).toFixed(1).replace(".", ","); }
  function numT(v) { var x = Math.round(Number(v) * 10) / 10; return x % 1 ? num1(x) : String(x); }   // талията: 78 / 78,5
  function nn(v, w) { return '<b class="n' + (w ? " " + w : "") + '">' + v + "</b>"; }   // Т76в: стойността — болд, в слот
  var NB = "\u00a0", SEP = ' <b class="sp" aria-hidden="true">·</b>' + NB, LEAD = '<b class="sp" aria-hidden="true">·</b>' + NB;   // Т76в: точката между нещата; LEAD — в началото на дясната колона
  function lv(label, val) { return label + NB + "<b>" + val + "</b>"; }   // етикет + стойност (болд), неразделими
  var DOT = '<b class="sp" aria-hidden="true">·</b>';
  function grps(list, lead) { return list.filter(Boolean).map(function (h, i) { return '<span class="g">' + (lead || i ? DOT + NB : "") + h + "</span>"; }).join(" "); }
  // Т76: новите колони на coach_list_clients (старото RPC ги няма → картата е както преди, без етап)
  function rich(r) { return "has_regime" in r || "log_mode" in r; }
  function stage(r) {
    if (!rich(r)) return "";
    return r.has_regime ? "Режим" : (r.n_analysis || 0) > 0 ? "Анализ" : r.log_mode === "sprint" ? LOG_TARGET + " дни · ден " + Math.min(r.log_days || 0, LOG_TARGET) : "Свободен лог";
  }
  function measCells(r) {   // [тегло + разликата | · дни · т · х] или [Мерки ДД.ММ | · т · х]
    var th = [], w = r.last_weight;
    if (r.last_waist != null) th.push(lv("т", numT(r.last_waist)));   // т = талия
    if (r.last_hip != null) th.push(lv("х", numT(r.last_hip)));       // х = ханш (Т76в)
    if (w == null) return ["Мерки " + (r.last_meas_day ? "<b>" + ddmm(r.last_meas_day) + "</b>" : "—"), grps(th, true)];
    var a = '<b class="n w5">' + num1(w) + "</b>" + NB + "кг", b;
    if (r.prev_weight != null && r.prev_weight_day && r.last_weight_day) {
      var d = Math.round((w - r.prev_weight) * 10) / 10;
      a += " " + (d === 0 ? '<span class="dl">=</span>' : '<span class="dl ' + (d > 0 ? "dup" : "ddown") + '">' + (d > 0 ? "↑" : "↓") + num1(Math.abs(d)) + "</span>");
      b = nn(dayDiff(r.prev_weight_day, r.last_weight_day)) + NB + "д";
    } else b = "<b>" + ddmm(r.last_weight_day || r.last_meas_day) + "</b>";
    return [a, grps([b].concat(th), true)];
  }
  function sigs(r) {   // тегловият сигнал не се повтаря, когато теглото с разликата вече е на картата
    var wd = r.last_weight != null && r.prev_weight != null;
    return (Array.isArray(r.d_signals) ? r.d_signals : []).map(function (s) { return String(s || "").trim(); }).filter(function (s) { return s && !(wd && /^тегло(\s|$)/i.test(s)); });
  }
  function cell(cls, h) { return h ? '<span class="' + cls + '">' + h + "</span>" : ""; }
  function rowHtml(r) {
    var days = r.log_days || 0, cnt = days >= LOG_TARGET ? "∞" : days + " / " + LOG_TARGET;
    var tab = "nachalo";   // Т79 (Chris 23:54): винаги „Начало“ — лентата долу показва (с вълна) къде има ново; разделът го избира той
    var badges = "";
    if (r.unread_msgs) badges += '<span class="b msg">✉ ' + r.unread_msgs + (r.unread_msgs === 1 ? " ново съобщение" : " нови съобщения") + "</span>";
    if (r.unread_answers) badges += '<span class="b ans">📋 нови отговори</span>';
    if (r.pending_labs) badges += '<span class="b lab">🧪 ' + r.pending_labs + (r.pending_labs === 1 ? " за препис" : " за препис") + "</span>";
    var ps = isPseudo(r), ms = measCells(r), sg = sigs(r);
    var t1 = "", t2 = "", n1 = "", n2 = "", fm = "", pm = "";
    if ((r.today_n || 0) > 0) {   // днес: записи · „Изядох“ · ккал от „Изядох“
      t1 = "Логнато" + NB + nn(r.today_n);   // Т77 (Chris 22:55): „Логнато“ вместо „Днес“ — всички записи за храна днес
      if ((r.today_eat || 0) > 0) t2 = grps(["Изядох" + NB + nn(r.today_eat), r.today_eat_kcal ? nn(Math.round(r.today_eat_kcal), "w4") + NB + "ккал" : ""], true);   // Т76в: думата, не ✅
    }
    if (r.d_kcal && r.d_day) {   // нощната сметка: вчера (или ДД.ММ) + средно за 7 дни
      n1 = '<span class="lb">' + (dayDiff(r.d_day, todayStr()) === 1 ? "Вчера" : ddmm(r.d_day)) + '</span> <b class="n w4">' + Math.round(r.d_kcal) + "</b>" + NB + "ккал";
      if (r.avg7_kcal != null) n2 = grps(["7" + NB + "д" + NB + "≈" + NB + nn(Math.round(r.avg7_kcal), "w4")], true);
    }
    var ic = r.intake_changes_today || 0;   // формата: ✓ / липсват N; + промени днес (Т76в: и при липсващо N — „Форма · днес N промени“)
    if (r.intake_missing != null || ic > 0) {
      fm = grps(["Форма" + (r.intake_missing == null ? "" : r.intake_missing === 0 ? NB + "<b>✓</b>" : ":" + NB + "<b>" + (r.intake_missing === 1 ? "липсва" + NB + "1" : "липсват" + NB + r.intake_missing) + "</b>"),
        ic > 0 ? "днес" + NB + "<b>" + ic + NB + (ic === 1 ? "промяна" : "промени") + "</b>" : ""], false);
    }
    if (r.last_client_msg && r.last_client_msg_at) {   // съобщението: денят + ✓ отговорено / ⚠ чака отговор · N д
      var md = sofiaDay(r.last_client_msg_at), ago = dayDiff(md, todayStr());
      pm = "<b>" + (ago === 0 ? "днес" : ago === 1 ? "вчера" : ddmm(md)) + NB + hm(r.last_client_msg_at) + "</b>";   // Т76в: денят И часът — болд
      if (r.last_client_msg_answered === true) pm += " ✓";
      else if (r.last_client_msg_answered === false) pm += ' <span class="wt">⚠ чака отговор' + (ago > 0 ? SEP + ago + NB + "д" : "") + "</span>";
    }
    return '<a class="row' + (isNew(r) ? " new" : "") + (ps ? " ps" : "") + (shimRow(r) ? " shim" : "") + '" data-id="' + esc(r.client_id) + '" href="' + esc(APP_URL) + "?c=" + encodeURIComponent(r.client_id) + "#" + tab + '">'
      + '<div class="l1"><span class="nm">' + esc(r.name || "(без име)") + "</span>" + (stage(r) ? '<span class="stg">' + esc(stage(r)) + "</span>" : "") + (r.coach_self === true ? '<span class="stg">Личен</span>' : "") + (r.is_dev ? '<span class="dev">DEV</span>' : !ps ? "" : String(r.name || "").indexOf("(ТЕСТ)") > -1 ? '<span class="dev">ТЕСТ</span>' : '<span class="dev">ЧЕРНОВА</span>')
      + '<span class="when">' + esc(when(r.last_activity)) + "</span></div>"
      + (badges ? '<div class="badges">' + badges + "</div>" : "")
      + '<div class="l2"><span class="c1">Лог <b class="lg">' + (days >= LOG_TARGET ? "∞" : '<span class="n">' + days + "</span> / " + LOG_TARGET) + "</b></span>"
      + '<span class="c2">' + grps([r.last_food_day ? lv("последно", ddmm(r.last_food_day)) : "още" + NB + "няма"], true) + "</span>"
      + '<span class="c3">' + ms[0] + "</span>" + cell("c4", ms[1]) + cell("t1", t1) + cell("t2", t2) + cell("n1", n1) + cell("n2", n2) + cell("fm", fm) + "</div>"
      + (r.last_client_msg ? '<div class="pv"><span class="pt">„' + esc(String(r.last_client_msg).replace(/\s+/g, " ")) + "“</span>" + (pm ? '<span class="pm">' + LEAD + pm + "</span>" : "") + "</div>" : "")
      + (sg.length ? '<div class="sg" title="' + esc(sg.join(" · ")) + '"><span class="fl">⚑</span> ' + sg.map(esc).join(SEP) + "</div>" : "")
      + "</a>";
  }
  function render() {
    var act = lsGet(ACTIVE_KEY) === "1";
    actBtn.classList.toggle("on", act); actBtn.setAttribute("aria-pressed", act ? "true" : "false");
    var nPs = ROWS.filter(isPseudo).length, nReal = ROWS.length - nPs, tests = nPs > 0 && lsGet(PSEUDO_KEY) === "1";
    psBtn.classList.toggle("hidden", !nPs);                  // без тестови бутонът го няма → винаги истинските
    psBtn.textContent = "Тестови · " + nPs;
    psBtn.classList.toggle("on", tests); psBtn.setAttribute("aria-pressed", tests ? "true" : "false");
    var rows = ROWS.slice().sort(function (a, b) { return String(b.last_activity || "").localeCompare(String(a.last_activity || "")); });
    rows = rows.filter(function (r) { return isPseudo(r) === tests; });   // Т54: или истинските, или тестовите
    var nAct = rows.filter(isActive).length;   // в текущия изглед
    actBtn.textContent = "Активни" + (nAct ? " (" + nAct + ")" : "");   // Т76
    if (act) rows = rows.filter(isActive);
    var n = rows.length, c = $("cnt");   // Т76б: колко се виждат сега (при „Активни“ — активните; в „Тестови“ — тестовите)
    c.textContent = String(n);
    c.classList.toggle("on", !act); c.setAttribute("aria-pressed", act ? "false" : "true");   // Т78: „всички“ е избран, когато „Активни“ не е
    c.setAttribute("aria-label", "Всички — " + n + (tests ? (n === 1 ? " тестов" : " тестови") : (n === 1 ? " клиент" : " клиента")));
    rowsEl.innerHTML = rows.length ? rows.map(rowHtml).join("")
      : '<div class="state" id="emptyList">' + (act ? (tests ? "Няма активни в тестовите." : "Няма активни клиенти.") : "Няма клиенти.") + "</div>";
  }
  psBtn.addEventListener("click", function () { lsSet(PSEUDO_KEY, lsGet(PSEUDO_KEY) === "1" ? null : "1"); render(); });
  // Т77: натиснат клиент → отворен сега (вълната му спира и при връщане назад)
  rowsEl.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".row[data-id]"); if (!a) return;
    var id = a.getAttribute("data-id"), r = ROWS.filter(function (x) { return x.client_id === id; })[0];
    // Т79: сега или последната активност — по-късното (часовникът на сървъра може да е напред спрямо телефона)
    lsSet(SEEN_AT + id, new Date(Math.max(Date.now(), (r && Date.parse(r.last_activity || "")) || 0)).toISOString());
    a.classList.remove("shim");
  });
  // Т78: „всички“ (броят) и „Активни“ — един избор; натиснатият остава избран (не превключва обратно)
  $("cnt").addEventListener("click", function () { lsSet(ACTIVE_KEY, null); render(); });
  actBtn.addEventListener("click", function () { lsSet(ACTIVE_KEY, "1"); render(); });

  function loadList() {
    if (!ROWS.length) state("Зарежда…");
    return sb.rpc("coach_list_clients").then(function (res) {
      if (res.error) { state(/forbidden|42501|permission/i.test(String(res.error.message || res.error.code)) ? "Този акаунт няма достъп до клиентите." : "Списъкът не се зареди. Опитай пак."); outBtn.style.display = "block"; return; }
      ROWS = res.data || [];
      show("list"); render();
    }, function () { state("Няма връзка. Опитай пак."); });
  }

  // ── старт: има ли запомнена сесия ──
  sb.auth.getSession().then(function (r) {
    var s = r && r.data && r.data.session;
    if (s) loadList(); else show("login");
  }, function () { show("login"); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && !list.classList.contains("hidden")) loadList(); });
  // Т86 (Chris 07:51–08:00): стояло във фона ≥ 10 мин → при връщане презарежда тихо (новият код и новите данни). Тук няма
  //   <meta name="version"> → само по времето. Пише се във входа (имейл/парола) → не; пак при следващото връщане.
  var BGC = { at: 0, pend: false }, bgcReload = function () { location.reload(); };
  function bgcBusy() {
    var lg = document.getElementById("login");
    if (lg && !lg.classList.contains("hidden") && Array.prototype.some.call(lg.querySelectorAll("input"), function (i) { return String(i.value || "").trim() !== ""; })) return true;
    var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && String(a.value || "").trim());
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { if (!BGC.at) BGC.at = Date.now(); return; }
    var away = BGC.at ? Date.now() - BGC.at : 0; BGC.at = 0;
    if (!BGC.pend && away < 10 * 60e3) return;
    if (bgcBusy()) { BGC.pend = true; return; }
    BGC.pend = false; bgcReload();
  });
  window.__coach = { reload: loadList, rows: function () { return ROWS; }, bg: { st: BGC, setReload: function (f) { bgcReload = f; } } };
})();
</script>
</body>
</html>
