<title>Личен дневник</title>
<!-- PWA: инсталируем на екрана (истински manifest); токенът се пази локално -->
<meta name="theme-color" content="#2e7d5b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<script>
(function () {
  // iOS 16.4+ ползва manifest.start_url (БЕЗ токен) + отделно standalone хранилище от Safari →
  // токенът се губи („Липсва код"). Затова НЕ слагаме <link rel=manifest> в HTML-а; добавяме го
  // през JS САМО за НЕ-iOS (Android). На iOS без manifest → A2HS (apple-meta) закача иконата към
  // ТЕКУЩИЯ URL (с токена) → токенът оцелява. (Диагностика 06.07: iOS стартираше ?src=pwa без токен.)
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!isIOS) {
    var lnk = document.createElement("link");
    lnk.rel = "manifest"; lnk.href = "manifest.webmanifest";
    document.head.appendChild(lnk);
  }
  // Токенът се пази локално → инсталираното приложение (start_url без токен) сам се връща на личния дневник.
  try {
    var t = new URLSearchParams(location.search).get("t");
    if (t) { localStorage.setItem("cdbgym_diary_token", t); }
    else {
      var saved = localStorage.getItem("cdbgym_diary_token");
      if (saved) { location.replace(location.pathname + "?t=" + saved); return; }
    }
  } catch (e) {}
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
<style>

  .cq b { display: block; color: var(--accent-dark); font-size: 12px; }

  .cb a { color: var(--accent-dark); font-weight: 600; word-break: break-all; }

  .crow { display: flex; align-items: flex-end; gap: 8px; }
  .crow textarea { flex: 1; min-width: 0; min-height: 46px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 12px; background: #fff; color: var(--ink); font-family: inherit; font-size: 16px; resize: vertical; }

  .msgbanner b { font-size: 17px; }
  .lf details.meas { margin: 8px 0 2px; border-top: 1px solid var(--border); padding-top: 6px; }

  .card .body .qa textarea { width: 100%; min-height: 54px; padding: 10px 11px; font-size: 16px; border: 1px solid var(--border); border-radius: 9px; font-family: inherit; color: var(--ink); background: #fff; resize: vertical; }
  .card .body .qa .qst { margin-top: 4px; font-size: 12.5px; font-weight: 600; color: var(--accent-dark); }
  .card .body .qa .qst.pend { color: #a0701c; }

  .card .body .qa .qaok.show { display: block; }
</style>

<script>
(function () {
  var SB_URL = "https://ankqnxqxrhonlffhxabn.supabase.co";
  var SB_KEY = "sb_publishable_4UGeheRP-noXzmxP5tuthg_dfeeMPDd";
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var SECTIONS = [
    { key: "info", label: "Информация" },
    { key: "nutrition", label: "Хранителен режим" },
    { key: "training", label: "Тренировки" },
    { key: "supplements", label: "Добавки" },
    { key: "labs", label: "Изследвания" },
    { key: "instruction", label: "Указания" }
  ];

  var loading = document.getElementById("loading");
  var content = document.getElementById("content");
  var who = document.getElementById("who");

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }
  function fmtDate(s) {
    if (!s) return "";
    var p = String(s).split("-");
    return p.length === 3 ? (p[2] + "." + p[1] + "." + p[0]) : s;
  }
  function fmtTime(s) {
    if (!s) return "";
    try {
      return new Date(s).toLocaleTimeString("bg-BG", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Sofia" });
    } catch (e) { return ""; }
  }
  function showState(msg) {
    loading.style.display = "none";
    content.innerHTML = '<div class="state">' + esc(msg) + "</div>";
  }
  function showMissingToken(storageKey) {
    var saved = "?"; try { saved = localStorage.getItem(storageKey) ? "да" : "не"; } catch (e) {}
    var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    loading.style.display = "none";
    content.innerHTML = '<div class="state">Липсва код в линка. Отвори линка, който получи.'
      + '<div style="margin-top:14px;padding:10px;border:1px dashed #d8dee5;border-radius:8px;font-size:11.5px;color:#6b7886;text-align:left;word-break:break-all;line-height:1.55;">'
      + '<b>Диагностика (за Chris):</b><br>URL: ' + esc(location.href)
      + '<br>Запазен код: ' + saved
      + '<br>Режим: ' + (standalone ? "приложение (standalone)" : "браузър")
      + '<br>iOS: ' + (ios ? "да" : "не") + '</div></div>';
  }

  function render(data) {
    loading.style.display = "none";
    if (data.name) who.textContent = data.name;
    var items = data.content || [];
    if (!items.length) {
      content.innerHTML = '<div class="state">Планът ти още се подготвя. Скоро тук ще има съдържание.</div>';
      return;
    }
    // Без персистенция: всеки рефреш връща default (само първата карта отворена) — реш. Chris 04.07.2026
    var html = "";
    var firstOpen = true;
    SECTIONS.forEach(function (sec) {
      var rows = items.filter(function (r) { return r.section === sec.key; });
      if (!rows.length) return;
      if (sec.key === "instruction") {
        rows.sort(function (a, b) { return (b.entry_date || "").localeCompare(a.entry_date || ""); });
      }
      html += '<div class="sec"><h2>' + esc(sec.label) + "</h2>";
      rows.forEach(function (r, i) {
        var key = sec.key + "_" + r.sort;
        var isOpen = firstOpen;
        firstOpen = false;
        html += '<div class="card' + (isOpen ? " open" : "") + '" data-key="' + key + '">';
        if (r.entry_date) html += '<div class="date">' + esc(fmtDate(r.entry_date)) + "</div>";
        html += '<div class="t">' + esc(r.title || "Виж") + "</div>";
        if (r.body) html += '<div class="body">' + r.body + "</div>";
        html += "</div>";
      });
      html += "</div>";
    });
    function logSummary(e) {
      var bits = [];
      function add(v, label, unit) { if (v != null && v !== "") bits.push(label + " " + v + unit); }
      add(e.weight, "тегло", " кг");
      add(e.neck, "врат", " см");
      add(e.chest, "гръд", " см");
      add(e.arm, "ръка", " см");
      add(e.waist, "талия", " см");
      add(e.hip, "ханш", " см");
      add(e.thigh, "бедро", " см");
      add(e.calf, "прасец", " см");
      return bits.join(" · ");
    }
    function notePreview(t) {
      t = String(t || "").replace(/\s+/g, " ").trim();
      return t.length > 50 ? t.slice(0, 50) + "…" : t;
    }
    // Разговорът (04.11.2026, реш. Chris): като Viber — старото горе, новото долу; балони; отговор на дадено съобщение
    // (client_log.reply_to) носи цитат, без него е ново. Старите отговори вътре в бележка (client_log.reply) се показват
    // като съобщения от Chris в своя час. Отговорите на въпросника се четат от картата — тук остава само един сив ред.
    var QA_HEAD = "📋 Отговори — ";
    function isQaNote(t) { return String(t || "").indexOf(QA_HEAD) === 0; }
    function msgHtml(s) {
      return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, "<br>");
    }
    function tsNum(ts) { var n = Date.parse(ts || ""); return isNaN(n) ? 0 : n; }
    function dayLabel(ts) {
      try { return new Date(ts).toLocaleDateString("bg-BG", { day: "numeric", month: "long", year: "numeric", timeZone: "Europe/Sofia" }); }
      catch (e) { return ""; }
    }
    function quoteText(e) {
      if (isQaNote(e.note)) return "Отговорите на въпросника";
      return notePreview(e.note) || logSummary(e);
    }
    function chatItems(log) {
      var items = [];
      (log || []).forEach(function (e) {
        var note = e.note ? String(e.note) : "", meas = logSummary(e), coach = e.kind === "coach";
        if (!coach && isQaNote(note)) items.push({ sys: "📋 Отговорите на въпросника са изпратени", ts: e.created_at, id: e.id });
        else if (note) items.push({ ts: e.created_at, id: e.id, mine: !coach, note: note, meas: meas, to: e.reply_to, ans: e.id });
        else if (meas) items.push({ sys: meas, ts: e.created_at, id: e.id });
        if (e.reply) items.push({ ts: e.reply_at || e.created_at, mine: false, note: String(e.reply), to: e.id, ans: e.id });
      });
      items.sort(function (a, b) { return tsNum(a.ts) - tsNum(b.ts); });
      return items;
    }
    function chatHtml(log) {
      var items = chatItems(log), byId = {}, out = "", day = "";
      if (!items.length) return '<p class="cempty">Още няма съобщения. Напиши първото отдолу.</p>';
      (log || []).forEach(function (e) { if (e.id) byId[e.id] = e; });
      items.forEach(function (m) {
        var d = dayLabel(m.ts), time = fmtTime(m.ts), idAttr = m.id ? ' data-id="' + esc(m.id) + '"' : "";
        if (d && d !== day) { day = d; out += '<div class="cday"><span>' + esc(d) + "</span></div>"; }
        if (m.sys) { out += '<div class="csys"' + idAttr + ">" + esc(m.sys) + (time ? " · " + esc(time) : "") + "</div>"; return; }
        var p = m.to && byId[m.to];
        out += '<div class="cmsg ' + (m.mine ? "me" : "them") + '"' + idAttr + '><div class="cb">'
          + (m.mine ? "" : '<div class="cwho">Chris</div>')
          + (p ? '<div class="cq" data-goto="' + esc(m.to) + '"><b>' + (p.kind === "coach" ? "Chris" : "Ти") + "</b>" + esc(quoteText(p)) + "</div>" : "")
          + (m.meas ? '<div class="cm">' + esc(m.meas) + "</div>" : "")
          + msgHtml(m.note) + '</div><div class="cmeta"><span>' + esc(time) + "</span>"
          + (!m.mine && isUnreadTs(String(m.ts || "")) ? '<span class="cnew">ново</span>' : "")
          + (m.ans ? '<button type="button" class="crep" data-reply="' + esc(m.ans) + '">Отговори</button>' : "")
          + "</div></div>";
      });
      return out;
    }
    var coachMsgs = (data.log || []).filter(function (e) { return e.kind === "coach"; });
    var SEEN_KEY = "diary_seen_coach_" + token;
    var seenTs = null; try { seenTs = localStorage.getItem(SEEN_KEY); } catch (e) {}
    // последна КЛИЕНТСКА активност — ако е писала СЛЕД съобщението, видяла го е (robust кросс-устройство)
    var lastClientAt = "";
    function computeLastClient() {
      (data.log || []).forEach(function (e) { if (e.kind !== "coach") { var c = String(e.created_at || ""); if (c > lastClientAt) lastClientAt = c; } });
    }
    computeLastClient();
    function isUnreadTs(ts) { return !!(ts && ts > lastClientAt && (!seenTs || ts > seenTs)); }
    var logHtml = '<div class="sec"><h2>Моят прогрес</h2>'
      + '<div class="card" data-key="log_form"><div class="t">Впиши тегло и обиколки</div><div class="body lf">'
      + '<p style="color:#6b7886;font-size:13px;margin:0 0 6px">По желание — попълни каквото следиш. Датата се добавя автоматично. За бележка или въпрос пиши в „Разговор“ отдолу.</p>'
      + '<label>Тегло (кг)</label><input type="number" id="lg_weight" inputmode="decimal">'
      + '<details class="meas"><summary>+ Обиколки (см) — по желание</summary>'
      + '<div class="row2"><div><label>Врат</label><input type="number" id="lg_neck" inputmode="decimal"></div>'
      + '<div><label>Гръд</label><input type="number" id="lg_chest" inputmode="decimal"></div></div>'
      + '<div class="row2"><div><label>Ръка (бицепс)</label><input type="number" id="lg_arm" inputmode="decimal"></div>'
      + '<div><label>Талия</label><input type="number" id="lg_waist" inputmode="decimal"></div></div>'
      + '<div class="row2"><div><label>Ханш</label><input type="number" id="lg_hip" inputmode="decimal"></div>'
      + '<div><label>Бедро</label><input type="number" id="lg_thigh" inputmode="decimal"></div></div>'
      + '<div class="row2"><div><label>Прасец</label><input type="number" id="lg_calf" inputmode="decimal"></div>'
      + '<div></div></div>'
      + '</details>'
      + '<button type="button" id="lgBtn">Запиши</button>'
      + '<div class="ok" id="lgOk">Записано. Благодаря!</div></div></div></div>'
      + '<div class="sec" id="chatSec"><h2>Разговор</h2><div class="chat" id="chatBox">' + chatHtml(data.log) + "</div>"
      + '<div class="cform"><div class="creply" id="cReply"><div class="crt" id="cReplyTxt"></div><button type="button" id="cReplyX" aria-label="Откажи отговора">✕</button></div>'
      + '<div class="crow"><textarea id="cText" rows="2" placeholder="Напиши съобщение…"></textarea><button type="button" id="cSend">Изпрати</button></div>'
      + '<div class="cerr" id="cErr">Неуспешно. Опитай пак.</div></div></div>';
    // всички съобщения от Chris = coach редове + стари отговори вътре в бележка; банерът брои непрочетените
    var msgEvents = [];
    coachMsgs.forEach(function (m) { if (m.created_at) msgEvents.push(String(m.created_at)); });
    (data.log || []).forEach(function (e) { if (e.kind !== "coach" && e.reply && e.reply_at) msgEvents.push(String(e.reply_at)); });
    var unread = msgEvents.filter(isUnreadTs);
    var bannerHtml = "";
    if (unread.length) {
      var nb = unread.length;
      bannerHtml = '<div class="msgbanner" id="msgBanner">✉ Имате <b>' + nb + '</b> '
        + (nb === 1 ? "ново съобщение" : "нови съобщения") + ' от Chris — прочети най-долу ↓</div>';
    }
    content.innerHTML = bannerHtml + html + logHtml;

    var msgBanner = document.getElementById("msgBanner");
    if (msgBanner) {
      var newestMsg = msgEvents.reduce(function (a, ts) { return (ts && (!a || ts > a)) ? ts : a; }, null);
      msgBanner.addEventListener("click", function () {
        try { localStorage.setItem(SEEN_KEY, newestMsg); } catch (e) {}
        msgBanner.style.display = "none";
        var cs = document.getElementById("chatSec");
        if (cs) cs.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    var chatBox = document.getElementById("chatBox");
    function chatBottom() { if (chatBox) chatBox.scrollTop = chatBox.scrollHeight; }
    function chatRefresh() {
      return sb.rpc("get_client_diary", { p_token: token }).then(function (res) {
        if (res.error || !res.data || !chatBox) return;
        data.log = res.data.log || [];
        computeLastClient();
        chatBox.innerHTML = chatHtml(data.log);
        chatBottom();
      });
    }
    chatBottom();
    var replyTo = null;
    var CHAT_DRAFT = "diary_chat_draft_" + token;
    var cText = document.getElementById("cText"), cSend = document.getElementById("cSend"), cErr = document.getElementById("cErr");
    var cReply = document.getElementById("cReply"), cReplyTxt = document.getElementById("cReplyTxt");
    function setReply(id) {
      var src = null;
      (data.log || []).forEach(function (e) { if (e.id === id) src = e; });
      replyTo = src ? id : null;
      cReplyTxt.textContent = src ? "Отговор на: " + quoteText(src) : "";
      cReply.classList.toggle("show", !!src);
    }
    cText.value = qaGet(CHAT_DRAFT) || "";
    cText.addEventListener("input", function () { qaSet(CHAT_DRAFT, cText.value.trim() ? cText.value : null); });
    document.getElementById("cReplyX").addEventListener("click", function () { setReply(null); });
    chatBox.addEventListener("click", function (e) {
      var rep = e.target.closest(".crep");
      if (rep) { setReply(rep.getAttribute("data-reply")); cText.focus(); return; }
      var q = e.target.closest(".cq");
      if (!q) return;
      var tgt = chatBox.querySelector('[data-id="' + q.getAttribute("data-goto") + '"]');
      if (!tgt) return;
      chatBox.scrollTop = Math.max(0, tgt.offsetTop - 40);
      tgt.classList.add("cflash");
      setTimeout(function () { tgt.classList.remove("cflash"); }, 1500);
    });
    cSend.addEventListener("click", function () {
      var txt = cText.value.trim();
      if (!txt) return;
      var args = { p_token: token, p_note: txt };
      if (replyTo) args.p_reply_to = replyTo;
      cSend.disabled = true; cErr.classList.remove("show");
      sb.rpc("add_log_entry", args)
        .then(function (res) {
          if (res.error || res.data === false) throw (res.error || new Error("fail"));
          cText.value = ""; qaSet(CHAT_DRAFT, null); setReply(null);
          cSend.disabled = false;
          return chatRefresh();
        })
        .catch(function () { cSend.disabled = false; cErr.classList.add("show"); });
    });

    var lgBtn = document.getElementById("lgBtn");
    if (lgBtn) lgBtn.addEventListener("click", function () {
      function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }
      function num(id) { var v = val(id); return v ? parseFloat(v) : null; }
      var fields = { weight: "lg_weight", waist: "lg_waist", hip: "lg_hip", neck: "lg_neck", chest: "lg_chest", arm: "lg_arm", thigh: "lg_thigh", calf: "lg_calf" };
      var ok = document.getElementById("lgOk");
      var rec = {};
      var any = false, k;
      for (k in fields) { var n = num(fields[k]); rec[k] = n; if (n != null) any = true; }
      if (!any) { ok.textContent = "Попълни поне едно поле."; ok.classList.add("show"); return; }
      lgBtn.disabled = true; lgBtn.textContent = "Записване…";
      sb.rpc("add_log_entry", { p_token: token, p_weight: rec.weight, p_waist: rec.waist, p_hip: rec.hip, p_neck: rec.neck, p_chest: rec.chest, p_arm: rec.arm, p_thigh: rec.thigh, p_calf: rec.calf })
        .then(function (res) {
          if (res.error || res.data === false) throw (res.error || new Error("fail"));
          ok.textContent = "Записано. Благодаря!"; ok.classList.add("show");
          for (k in fields) { var el = document.getElementById(fields[k]); if (el) el.value = ""; }
          lgBtn.disabled = false; lgBtn.textContent = "Запиши";
          return chatRefresh();
        })
        .catch(function () { lgBtn.disabled = false; lgBtn.textContent = "Запиши"; ok.textContent = "Неуспешно. Опитай пак."; ok.classList.add("show"); });
    });

    // Въпросник в карта (31.10.2026): <div class="qa" data-qa="Заглавие"> + <div class="qi" data-n="1"><div class="qq">1. …</div><textarea></textarea></div> … + .qabtn + .qaok
    // Отговорите влизат като бележка в client_log (add_log_entry, без промяна по базата); в „Разговор“ стои само сив ред,
    // а картата ги чете обратно от бележката: последният изпратен отговор стои В полето (поправя/допълва се и се праща пак — пращат се
    // само променените). Неизпратеното се пази на устройството до изпращане.
    function qaNorm(s) { return String(s || "").replace(/\r/g, "").replace(/\n\s*\n+/g, "\n").trim(); }
    function qaGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function qaSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
    function qaStatus(qi, sent, ta) {
      var st = qi.querySelector(".qst");
      if (!st) { st = document.createElement("div"); st.className = "qst"; qi.appendChild(st); }
      var v = qaNorm(ta.value), txt = "", pend = false;
      if (sent && v === sent.text) txt = "✓ Изпратено · " + fmtDate(sent.date) + (fmtTime(sent.at) ? ", " + fmtTime(sent.at) : "");
      else if (v) { txt = sent ? "✎ Променено — още не е изпратено" : "✎ Още не е изпратено"; pend = true; }
      else if (sent) { txt = "Празно поле не се изпраща — изпратеният отговор остава."; pend = true; }
      st.textContent = txt; st.className = "qst" + (pend ? " pend" : ""); st.style.display = txt ? "" : "none";
    }
    function qaParse(log, title) {
      var head = QA_HEAD + title + "\n", ans = {};
      (log || []).slice().reverse().forEach(function (e) {
        var n = String(e.note || "");
        if (e.kind === "coach" || n.indexOf(head) !== 0) return;
        n.slice(head.length).split(/\n\s*\n/).forEach(function (blk) {
          var m = /^(\d+)\.[^\n]*\n→ ([\s\S]+)$/.exec(blk.trim());
          if (m) ans[m[1]] = { text: m[2].trim(), date: e.entry_date, at: e.created_at };
        });
      });
      return ans;
    }
    Array.prototype.forEach.call(content.querySelectorAll(".qa"), function (qa) {
      var title = qa.getAttribute("data-qa") || "Въпроси";
      var items = qa.querySelectorAll(".qi");
      var sentMap = qaParse(data.log, title);
      function lkey(n) { return "diary_qa_" + token + "_" + title + "_" + n; }
      Array.prototype.forEach.call(items, function (qi) {
        var n = qi.getAttribute("data-n"), ta = qi.querySelector("textarea");
        if (!ta) return;
        var loc = qaGet(lkey(n)), sent = sentMap[n];
        if (loc != null && sent && qaNorm(loc) === sent.text) { qaSet(lkey(n), null); loc = null; }
        ta.value = loc != null ? loc : (sent ? sent.text : "");
        qaStatus(qi, sent, ta);
        ta.addEventListener("input", function () {
          var s = sentMap[n], v = qaNorm(ta.value);
          qaSet(lkey(n), (s ? v !== s.text : !!v) ? ta.value : null);
          qaStatus(qi, s, ta);
        });
      });
      var btn = qa.querySelector(".qabtn"), ok = qa.querySelector(".qaok");
      if (!btn || !ok) return;
      btn.addEventListener("click", function () {
        var parts = [], got = [];
        Array.prototype.forEach.call(items, function (qi) {
          var n = qi.getAttribute("data-n"), ta = qi.querySelector("textarea");
          var v = ta ? qaNorm(ta.value) : "";
          if (!v || (sentMap[n] && v === sentMap[n].text)) return;
          var qt = (qi.querySelector(".qq") || {}).textContent || "";
          qt = qt.replace(/^\s*\d+\.\s*/, "").replace(/\s+/g, " ").trim();
          parts.push(n + ". " + qt + "\n→ " + v);
          got.push([qi, n, ta, v]);
        });
        if (!parts.length) {
          ok.textContent = Object.keys(sentMap).length ? "Няма промени за изпращане." : "Напиши поне един отговор.";
          ok.classList.add("show"); return;
        }
        var note = QA_HEAD + title + "\n\n" + parts.join("\n\n");
        btn.disabled = true; btn.textContent = "Изпращане…";
        sb.rpc("add_log_entry", { p_token: token, p_note: note })
          .then(function (res) {
            if (res.error || res.data === false) throw (res.error || new Error("fail"));
            var now = new Date().toISOString();
            got.forEach(function (g) {
              sentMap[g[1]] = { text: g[3], date: now.slice(0, 10), at: now };
              g[2].value = g[3]; qaSet(lkey(g[1]), null); qaStatus(g[0], sentMap[g[1]], g[2]);
            });
            ok.textContent = "Изпратено. Благодаря!"; ok.classList.add("show");
            btn.disabled = false; btn.textContent = "Изпрати отговорите";
            return chatRefresh();
          })
          .catch(function () { btn.disabled = false; btn.textContent = "Изпрати отговорите"; ok.textContent = "Неуспешно. Опитай пак."; ok.classList.add("show"); });
      });
    });

    content.addEventListener("click", function (e) {
      if (e.target.closest(".body")) return;
      var card = e.target.closest(".card");
      if (card) { card.classList.toggle("open"); }
    });

    var sy = parseInt(sessionStorage.getItem("diary_scroll_" + token), 10);
    if (sy > 0) {
      var doRestore = function () { window.scrollTo(0, sy); };
      void document.body.offsetHeight;
      doRestore();
      setTimeout(doRestore, 80);
      setTimeout(doRestore, 250);
    }
  }

  var token = new URLSearchParams(location.search).get("t");
  if (!token) { showMissingToken("cdbgym_diary_token"); return; }

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  var scrollT;
  window.addEventListener("scroll", function () {
    clearTimeout(scrollT);
    scrollT = setTimeout(function () {
      try { sessionStorage.setItem("diary_scroll_" + token, String(window.scrollY)); } catch (e) {}
    }, 120);
  });

  sb.rpc("get_client_diary", { p_token: token }).then(function (res) {
    if (res.error) { showState("Възникна грешка при зареждането. Опитай по-късно."); return; }
    if (!res.data) { showState("Линкът е невалиден или вече не е активен."); return; }
    render(res.data);
  }, function () {
    showState("Няма връзка. Провери интернета и опитай пак.");
  });
})();
</script>
</body>
</html>
