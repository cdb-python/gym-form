<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="version" content="v1.17.0">
<title>Твоят дневник</title>
<!-- Клиентската страница с 4 бутона (08.11.2026). Т57 (09.11.2026): приложението на всеки клиент — tools/me/ и form3L пренасочват тук. -->
<meta name="theme-color" content="#c77d2e">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
window.PWA_BASE = "";   // папката на manifest-а и иконите спрямо страницата (тестовата обвивка я сменя)
(function () {
  // Т17 — инсталиране (PWA). iOS урокът (PLATFORM.md §4, 06.07): <link rel=manifest> НЕ стои в HTML-а; добавя се през JS само за не-iOS.
  // На iOS без manifest иконата на екрана пази ТЕКУЩИЯ URL с токена (?t=). Логиката е 1:1 от tools/me/ и Victus phe-tracker.
  // ИМЕТО на приложението е на ЕДНО място: manifest.webmanifest (name / short_name). iOS не получава manifest-а →
  // оттам се чете short_name за apple-mobile-web-app-title (без него iOS слага <title>).
  var PWA_FILES_READY = true, MANIFEST = window.PWA_BASE + "manifest.webmanifest";
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (PWA_FILES_READY && !isIOS) {
    var lnk = document.createElement("link");
    lnk.rel = "manifest"; lnk.href = MANIFEST;
    document.head.appendChild(lnk);
  }
  if (PWA_FILES_READY && isIOS) {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", MANIFEST);
      x.onload = function () {
        try {
          var m = JSON.parse(x.responseText), meta = document.createElement("meta");
          meta.name = "apple-mobile-web-app-title"; meta.content = m.short_name || m.name;
          document.head.appendChild(meta);
        } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }
  // Токенът се пази локално → инсталираното приложение (start_url без токен) само се връща на личната страница.
  // Режим треньор (?c=<client_id> + сесия): токенът не се пипа и не се подменя със запазения.
  try {
    var t = new URLSearchParams(location.search).get("t");
    if (new URLSearchParams(location.search).get("c")) { /* треньор */ }
    else if (t) { if (!new URLSearchParams(location.search).get("from")) localStorage.setItem("cdbgym_app_token", t); }   // Т45: &from = треньорът гледа → не става „последният клиент“ на телефона му
    else {
      var saved = localStorage.getItem("cdbgym_app_token");
      if (saved) { location.replace(location.pathname + "?t=" + saved + location.hash); return; }
    }
  } catch (e) {}
  if (PWA_FILES_READY && "serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
<style>
  :root {
    /* Т45: клиентът — оранжевото на фе-тракера (cdb-Victus/app/phe-tracker); треньорът (body.coach-on) остава сив */
    --bg: #f8efe6;               /* кремавият фон на фе-тракера */
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5f6b78;            /* вторичният текст (и в двата режима): 4,79 на крема, 5,44 на бяло, 5,02 на сивия фон */
    --accent: #c77d2e;           /* шапката, хапчетата на лентата, иконите, рамки/фокус; бял текст на него само едър (3,28) */
    --accent-dark: #8a5a1a;      /* ВСИЧКИ оранжеви текстове на светло (5,9 на бяло, 5,2 на крема) + hover/active на бутоните */
    --btn: #a55f18;              /* плътните бутони с бял текст (бял 4,94) */
    --border: #d8dee5;
    --soft: #fbf1e6;
    /* Т21: всички тонове на темата са променливи → в режим треньор (body.coach-on) стават сиви на едно място */
    --soft2: #fcebd6;            /* фон на значки, „записано“, броячът */
    --okline: #ecc596;           /* рамка на „записано“ */
    --line: #e9cfa9;             /* пунктирни/тънки рамки */
    --ate: #fdf3e6;              /* изядено хранене */
    --me: #f9e2c7;               /* моите балони в Разговор */
    --accent-a40: rgba(199,125,46,0.4);   /* подчертаване на линковете */
    --btn-off: #e3d3bf;          /* изключеният „Изпрати“ */
    --edge: #b06f22;             /* Т26: цветната лява страна на картите и панелите (декоративна; --card-edge на фе-тракера) */
    --up: #c43d3d;               /* Т46: разлика нагоре (+) — червено; семантично, еднакво и при треньора (5,2 на бяло) */
    --down: #2e7d5b;             /* Т46: разлика надолу (−) — зелено (5,0 на бяло) */
    --warn: #a0701c;
    --navh: 48px;      /* Т36: височината на хапчето: 4 + 40 + 4 */
    --navgap: 14px;    /* отстоянието на плаващата лента от долния край */
    --top: 0px;
    --ptop: 16px;      /* Т48: шапка → първият блок на таба; измерено в Начало (.now) и Мерки (.mcard) — същото навсякъде */
  }
  * { box-sizing: border-box; }
  /* Една колона с ширината на телефон: на десктоп е центрирана (знак, хедър, съдържание, лента, поле за писане);
     на телефон (≤480 px) — пълна ширина, без рамка. */
  /* Т18: мястото на скролбара е запазено винаги (Windows/компютър). Иначе при смяна на бутон или отваряне на акордеон страницата
     минава от „по-къса от екрана“ към „по-дълга“, скролбарът (15 px) се появява/изчезва и колоната прескача с 7,5 px — „премигването“.
     На телефона скролбарът е върху съдържанието → тук няма ефект. Стар браузър без scrollbar-gutter → винаги видим скролбар. */
  html { -webkit-text-size-adjust: 100%; background: #e8ecef; scrollbar-gutter: stable; }
  @supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
  body {
    font-variant-numeric: tabular-nums;   /* Т30: цифрите с еднаква ширина — в колони десетиците са една под друга */
    margin: 0 auto;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    padding: 0 0 calc(var(--navh) + var(--navgap) + env(safe-area-inset-bottom, 0px) + 24px);
    overflow-x: hidden;
  }
  /* Т17: iPhone, инсталирано (black-translucent): лента с цвета на иконата под часовника, за да не легне текст под него */
  body::before { content: ""; display: block; height: env(safe-area-inset-top, 0px); background: #1a1c3e; }
  /* Т17: „Инсталирай на телефона“ (Начало; само ако не е инсталирано; × скрива за 14 дни) */
  .inst { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; align-items: center; margin: 14px 0 4px; padding: 12px 40px 12px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .inst img { width: 40px; height: 40px; border-radius: 9px; display: block; }
  .inst .ih { font-size: 15.5px; font-weight: 700; line-height: 1.3; }
  .inst .ix { position: absolute; top: 4px; right: 4px; width: 34px; height: 34px; padding: 0; border: none; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; border-radius: 8px; }
  .inst .ib { grid-column: 1 / -1; }
  .inst.ro { opacity: 0.55; }   /* Т96: изгледите на треньора — картата на клиента (само когато той я вижда), бледа като изключеното „Запиши“ */
  .inst.ro .ix:disabled { opacity: 1; cursor: not-allowed; }
  .iareas .inone { margin-top: 4px; }   /* Т90: „Нямам оплаквания“ — последно, малко отделено от областите */
  .inst .ib .btn { margin-top: 6px; }
  .inst ol { margin: 4px 0 0; padding-left: 22px; font-size: 14.5px; line-height: 1.6; }
  .inst p { margin: 4px 0 0; font-size: 14.5px; }
  .inst .shr { display: inline-block; width: 17px; height: 17px; vertical-align: -3px; margin-left: 2px; color: #1a7cf5; }
  /* Т47: ЕДИН надпис „ЧЕРНОВА“ — в шапката, на ред под името; шрифтът на името (размер, дебелина, семейство), червени букви на светло
     хапче (#c43d3d на бяло = 5,2:1; на оранжевата шапка би бил ~1,4). Само у клиента (и DEV, и изгледът като клиент); при треньора — не. */
  header p.dmark { margin: 3px 0 0; opacity: 1; line-height: 1.3; }
  .dmark span { display: inline-block; padding: 0 6px; border-radius: 7px; background: #fff; color: #c43d3d; letter-spacing: normal; }
  header { position: relative; background: var(--accent); color: #fff; padding: 12px 16px 12px; text-align: center; }
  header h1 { margin: 0; font-size: 19px; line-height: 1.3; }
  header p { margin: 0; font-size: 14px; opacity: 0.92; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }
  #main { display: flow-root; }   /* Т25: долното поле на последната карта остава вътре → височината на съдържанието се мери точно */
  .pane { display: none; }
  .pane.on { display: block; }
  .pane:not(#p-razgovor) > :first-child { margin-top: var(--ptop); }   /* Т48: Данни беше залепен (0), Храна 18 — сега всички като Начало/Мерки */
  .sec { margin: 18px 0 6px; }
  .sec h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent-dark); margin: 0 0 8px; padding-left: 2px; }
  .lead { color: var(--muted); font-size: 14px; margin: 14px 2px 0; }

  /* карти (като в me/) */
  .card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--edge); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
  .card > .ch { font-weight: 700; font-size: 16px; margin: 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card > .ch::after { content: "▸"; color: var(--accent); font-size: 14px; flex: none; }
  .card.open > .ch::after { content: "▾"; }
  .card > .ch .chip { flex: none; margin-left: auto; padding: 1px 8px; border-radius: 999px; background: var(--soft2); color: var(--accent-dark); font-size: 12px; font-weight: 700; }
  .card > .ch .chip.pend { background: #fbf0dc; color: var(--warn); }
  /* Т84/Т84б (Chris 07:55): при треньора — видял ли е клиентът картата. Горе вдясно, до ръбовете, на едно и също място на затворената
     и на отворената карта (като часа в списъка на клиентите: ~6 px отгоре, ~8 px отдясно, 11,5 px, сиво, не болд). В реда, не absolute:
     свой горен ред (.seenrow) — заглавието не влиза под него, стрелката и ⓘ остават на мястото си, датата е в своя ред под него. */
  .seenst { font-size: 11.5px; font-weight: 400; line-height: 1.25; color: var(--muted); white-space: nowrap; }
  .card > .seenrow { display: flex; justify-content: flex-end; margin: -8px -8px 2px 0; }
  /* Т111 (Chris 12.11 16:20): датата на картата — горе вдясно, дребна и сива като часа в списъка на треньора (вместо реда над заглавието).
     При треньора е в същия ред, вляво от „видяно“ („видяно“ остава в ъгъла, Т84б); не се събират ли (тясно + най-дългото „видяно“) —
     датата слиза под него, вдясно (wrap-reverse). */
  .card > .seenrow { flex-wrap: wrap-reverse; column-gap: 10px; }
  .cdate { font-size: 11.5px; font-weight: 400; line-height: 1.25; color: var(--muted); white-space: nowrap; }
  .card.panel[data-key="qa"] > .body .qpend > .card > .seenrow { margin: 6px 0 -4px 0; }
  .card.panel[data-key="qa"] > .body .qpend > .card.hasr > .ch { padding-top: 2px; }
  .an .card.hasr > .ch { flex-wrap: wrap; }
  .an .card > .ch > .seenrow { flex: 0 0 calc(100% + 6px); display: flex; justify-content: flex-end; margin: -6px -6px 2px 0; }
  .an .card > .ch .seenst { color: rgba(255,255,255,0.85); }
  .an .card.lx > .ch .seenst { color: var(--muted); }
  details.qday > summary > .seenrow { grid-column: 1 / -1; justify-self: end; margin: -6px -6px 0 0; }
  .card.hist details.qday > summary > .seenrow { margin: -4px 0 0 0; }   /* в хронологията редът е с отстъп 10 px / 2 px → ъгълът е ~6 px отгоре, до ръба вдясно */
  .card > .body { font-size: 15.5px; margin-top: 8px; display: none; overflow-x: auto; }
  .card.open > .body { display: block; }
  .card .body p { margin: 0 0 8px; }
  .card .body p:last-child { margin-bottom: 0; }
  .card .body ul { margin: 6px 0; padding-left: 20px; }
  .card .body table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 8px 0; font-size: 13.5px; }
  .card .body th, .card .body td { border: 1px solid var(--border); padding: 6px 7px; text-align: left; word-break: break-word; vertical-align: top; }
  .card .body th { background: var(--soft); color: var(--accent-dark); }
  .card .body td:first-child, .card .body th:first-child { width: 40%; }
  .card .body details.fx { border: 1px solid var(--border); border-radius: 10px; background: #fff; margin: 8px 0; }
  .card .body details.fx > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 15px; color: var(--accent-dark); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card .body details.fx > summary::-webkit-details-marker { display: none; }
  .card .body details.fx > summary::after { content: "+"; color: var(--accent); font-size: 20px; font-weight: 400; line-height: 1; flex: none; }
  .card .body details.fx[open] > summary { border-bottom: 1px solid var(--border); }
  .card .body details.fx[open] > summary::after { content: "\2212"; }
  .card .body details.fx > .fxb { padding: 11px 14px 13px; font-size: 15px; }
  /* Т42: групите на интейка — иконката в клетка с еднаква ширина → текстът започва на една линия при всичките 8 */
  .igt { display: flex; align-items: baseline; gap: 0; min-width: 0; }
  .igi { flex: none; width: 1.6em; text-align: left; font-weight: 400; }
  .igx { min-width: 0; }
  /* Т43: линейните икони (IC). Линията на екрана = в лентата (40 px × 1/24 ≈ 1,67 px) при всеки размер: non-scaling-stroke + 1,67 px.
     В текст — центърът на височината на главните букви; в картите, „Ново за теб“ и групите на формата — акцентът (в режим треньор — сив, Т21). */
  svg.ic { display: inline-block; flex: none; width: 1.1em; height: 1.1em; vertical-align: -0.19em; overflow: visible; stroke-width: 1.67px; }
  svg.ic * { vector-effect: non-scaling-stroke; }
  svg.ic.icl { margin-right: 0.3em; }
  .card.panel > .ch .ico { display: flex; color: var(--accent); }
  .card.panel > .ch .ico svg.ic { width: 24px; height: 24px; }
  .now a .i { color: var(--accent); }
  .now a .i svg.ic { width: 22px; height: 22px; vertical-align: -5.5px; }
  .igi { color: var(--accent); }
  .igi svg.ic { width: 20px; height: 20px; vertical-align: -4.5px; }
  #upBtn svg.ic { width: 1.25em; height: 1.25em; vertical-align: -0.27em; margin-right: 0.35em; }
  .csys svg.ic { width: 1.3em; height: 1.3em; vertical-align: -0.32em; margin-right: 0.35em; }
  .qst svg.ic { width: 1.25em; height: 1.25em; vertical-align: -0.27em; }
  .crow button svg.ic { width: 22px; height: 22px; }
  .cdown svg.ic { display: block; margin: 0 auto; width: 22px; height: 22px; }
  .creply button svg.ic { display: block; width: 18px; height: 18px; }
  .hbtn.back svg.ic { width: 20px; height: 20px; }
  .hbtn.out svg.ic { width: 18px; height: 18px; }
  #whoBtn .ar svg.ic { width: 15px; height: 15px; vertical-align: -2px; }
  .card .body details.fx > .fxb p:first-child { margin-top: 0; }
  .card .body a[data-go], .card .body a[data-arch], .now a { color: var(--accent-dark); font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent-a40); text-underline-offset: 2px; cursor: pointer; }
  .flash { outline: 2px solid var(--accent); outline-offset: 2px; transition: outline-color 0.4s; }
  /* Т77 (Chris 10.11 22:17): при треньора новото от предното му влизане — светла вълна, която минава през цялата карта отляво надясно
     (~1,8 s, непрекъснато, без мигане), докато не бъде видяна. Само фонът (под текста) → четенето не се пречи. Сивосинкаво на бялото,
     бяло на сивата лента долу. „Без движение“ (prefers-reduced-motion / REDUCE) → само лек неподвижен отблясък. */
  .shim { background-image: linear-gradient(100deg, rgba(120,140,165,0) 35%, rgba(120,140,165,0.22) 50%, rgba(120,140,165,0) 65%) !important; background-size: 300% 100% !important; background-repeat: no-repeat !important; animation: shimw 1.8s linear infinite; }
  @keyframes shimw { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  html.rm .shim { animation: none; background-image: linear-gradient(100deg, rgba(120,140,165,0.16), rgba(120,140,165,0.05)) !important; background-size: 100% 100% !important; }
  @media (prefers-reduced-motion: reduce) {
    .shim { animation: none; background-image: linear-gradient(100deg, rgba(120,140,165,0.16), rgba(120,140,165,0.05)) !important; background-size: 100% 100% !important; }
  }
  /* Т81 (Chris 01:35): клиентската страница — вълната вместо червените точки, в оранжевото на клиентското приложение (#c77d2e);
     „без движение“ → лек неподвижен оранжев отблясък. Треньорът (body.coach-on) остава сивосинкав. Лентата долу — Т82 (пулс). */
  body:not(.coach-on) .shim { background-image: linear-gradient(100deg, rgba(199,125,46,0) 35%, rgba(199,125,46,0.24) 50%, rgba(199,125,46,0) 65%) !important; }
  html.rm body:not(.coach-on) .shim { background-image: linear-gradient(100deg, rgba(199,125,46,0.18), rgba(199,125,46,0.06)) !important; }
  @media (prefers-reduced-motion: reduce) {
    body:not(.coach-on) .shim { background-image: linear-gradient(100deg, rgba(199,125,46,0.18), rgba(199,125,46,0.06)) !important; }
  }
  /* Т82 (Chris 04:20–04:22): иконата на раздела долу не е с вълна — самата икона пулсира на място: леко се уголемява (1 → 1,12)
     и обратно, плавно, ~1,6 s, безкрайно. Бутонът и лентата не мърдат, нищо не минава отстрани. Спира както досега (Т77/Т79 —
     разделът се отваря). И при треньора, и при клиента. Т83 (Chris 05:24): без белия ореол — товари, „като светофар“; само размерът.
     „Без движение“ → иконата стои неподвижно уголемена (1,12): знакът остава, без анимация (transform — нищо не се разместява). */
  :root nav.tabs button.shim[data-tab] { background-image: none !important; animation: none !important; }
  nav.tabs button.shim .nav-ic { animation: shpulse 1.6s ease-in-out infinite; will-change: transform; }
  @keyframes shpulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  html.rm nav.tabs button.shim .nav-ic { animation: none; transform: scale(1.12); }
  @media (prefers-reduced-motion: reduce) {
    nav.tabs button.shim .nav-ic { animation: none; transform: scale(1.12); }
  }
  /* Т82: отворена карта / група с вълна (първата карта е отворена, а текстът се вълнува, докато си в раздела — Т79) → вълната минава
     само в горната ивица, висока колкото затворената карта (--shh: заглавието + отстъпите, мери го shBand); отдолу картата е чиста.
     Заглавие със свой плътен фон (отворен панел, месец, картите на анализа) скрива фона на картата → там вълната е на самото заглавие
     (.shhd), а на тъмно заглавие — бяла (.shdk). Затворените карти, редовете, полетата, хапчетата и балоните — както досега. */
  /* Т82 Д (Chris 04:51–04:53): ОБЩОТО ПРАВИЛО — вълната никога не е по-висока от една заглавна ивица, колкото затворена карта
     (едноредовата затворена карта е 53 px вътре в рамката). Ниско (ред, поле, хапче, къс балон, ред в „Ново за теб“) → покрито цялото;
     високо (дълго съобщение в Разговор, дълъг запис, въпрос във формата) → само горните 53 px, отдолу текстът е чист и се чете спокойно.
     Отворена карта / група — ивицата ѝ (--shh, по-горе); затворените бутони (карта, панел, месец, ден) и редовете в „Ново за теб“
     (бутони и те, понякога на два реда) — цели: те самите са една ивица.
     Без движение — същото, неподвижно. Пулсът на иконите долу е отделен. Стар браузър без min() → остава цялото (както преди). */
  .shim { background-size: 300% min(100%, 53px) !important; }
  .card.shim:not(.open), details.shim:not([open]), .now a.shim { background-size: 300% 100% !important; }
  html.rm .shim { background-size: 100% min(100%, 53px) !important; }
  html.rm .card.shim:not(.open), html.rm details.shim:not([open]), html.rm .now a.shim { background-size: 100% 100% !important; }
  @media (prefers-reduced-motion: reduce) {
    .shim { background-size: 100% min(100%, 53px) !important; }
    .card.shim:not(.open), details.shim:not([open]), .now a.shim { background-size: 100% 100% !important; }
  }
  .shim { --shc: 120,140,165; --sha: 0.22; --shs: 0.16; --she: 0.05; }
  body:not(.coach-on) .shim { --shc: 199,125,46; --sha: 0.24; --shs: 0.18; --she: 0.06; }
  .shim.shhd.shdk { --shc: 255,255,255; --sha: 0.4; --shs: 0.3; --she: 0.1; }
  .card.open.shim, details[open].shim { background-size: 300% var(--shh, 0px) !important; }
  html.rm .card.open.shim, html.rm details[open].shim { background-size: 100% var(--shh, 0px) !important; }
  @media (prefers-reduced-motion: reduce) { .card.open.shim, details[open].shim { background-size: 100% var(--shh, 0px) !important; } }
  :root .card.open.shim.shhd, :root details[open].shim.shhd { background-image: none !important; animation: none !important; }
  .card.open.shim.shhd > .ch, details[open].shim.shhd > summary { background-image: linear-gradient(100deg, rgba(var(--shc),0) 35%, rgba(var(--shc),var(--sha)) 50%, rgba(var(--shc),0) 65%) !important;
    background-size: 300% 100% !important; background-repeat: no-repeat !important; animation: shimw 1.8s linear infinite; }
  html.rm .card.open.shim.shhd > .ch, html.rm details[open].shim.shhd > summary { animation: none; background-image: linear-gradient(100deg, rgba(var(--shc),var(--shs)), rgba(var(--shc),var(--she))) !important; background-size: 100% 100% !important; }
  @media (prefers-reduced-motion: reduce) {
    .card.open.shim.shhd > .ch, details[open].shim.shhd > summary { animation: none; background-image: linear-gradient(100deg, rgba(var(--shc),var(--shs)), rgba(var(--shc),var(--she))) !important; background-size: 100% 100% !important; }
  }

  /* панели (акордеон от първо ниво в Храна и Данни) */
  .card.panel { border-left-width: 5px; padding: 0; overflow: hidden; }
  .card.panel > .ch { padding: 14px 16px; font-size: 16.5px; }
  .card.panel > .ch .ico { flex: none; font-size: 19px; }
  .card.panel > .ch .ttl { flex: 1; min-width: 0; }
  .card.panel > .ch .sub { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .card.panel.open > .ch { border-bottom: 1px solid var(--border); background: var(--soft); }
  .card.panel > .body { margin: 0; padding: 12px 12px 4px; background: #fafbfc; }
  .card.panel > .body > .card { border-left-width: 3px; }
  /* Т22: „Допълнителни въпроси“ (беше „Въпроси към теб“) — вътре без рамки и цветни ленти: редове с тънка линия (цветната страна е само на външната карта) */
  .card.panel[data-key="qa"] > .body .qpend > .card,
  .card.panel[data-key="qa"] > .body .qmonths > .card.hm { border: none; border-top: 1px solid var(--border); border-radius: 0; background: transparent; margin: 0; padding: 0; overflow: visible; }
  .card.panel[data-key="qa"] > .body .qpend > .card:first-child { border-top: none; }
  .card.panel[data-key="qa"] > .body .qpend > .card > .ch,
  .card.panel[data-key="qa"] > .body .qmonths > .card.hm > .ch { padding: 12px 2px; background: none; border-bottom: none; }
  .card.panel[data-key="qa"] > .body .qpend > .card > .body { margin: 0; padding: 0 2px 12px; }
  .card.panel[data-key="qa"] > .body .qmonths > .card.hm > .body { margin: 0; padding: 0 2px 6px; background: none; }
  .card.panel[data-key="qa"] > .body .qpend + .qmonths > .card.hm:first-child, .card.panel[data-key="qa"] > .body #qaEmpty + .qmonths > .card.hm:first-child { border-top: 1px solid var(--border); }
  .card.panel[data-key="qa"] > .body #qaEmpty { margin: 2px 2px 12px; }
  .qsent + .qsent { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
  .qsent .qs-h { font-weight: 700; font-size: 15px; color: var(--ink); }
  .qsent .qs-h .qs-sub { color: var(--muted); font-size: 13px; font-weight: 600; }
  .qsent .qcqa > p:first-child { margin-top: 6px; }

  /* Ново за теб */
  .now { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--edge); border-radius: 12px; padding: 10px 14px; margin: 16px 0 4px; }
  .now h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent-dark); }
  .now h3 { display: flex; align-items: center; }   /* Т82: ⓘ до заглавието — зоната 32 px не мени височината на реда */
  .now h3 .ibtn { margin-top: -9px; margin-bottom: -9px; }
  .now a { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; }
  .now a:first-of-type { border-top: none; }
  .now a .i { flex: none; width: 22px; text-align: center; }
  .now a .x { flex: 1; min-width: 0; }
  /* Т44: версията — най-долу в Начало; сивият цвят на вторичния текст, 12 px, цифри с еднаква ширина; не е бутон, не е линк */
  .appver { margin: 24px 0 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.4; font-variant-numeric: tabular-nums; }
  .now a::after { content: "›"; flex: none; color: var(--accent); font-size: 20px; line-height: 1; }

  .state { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 18px; margin: 22px 0; text-align: center; color: var(--muted); font-size: 15.5px; }
  .loading { text-align: center; color: var(--muted); padding: 30px 0; }
  .empty { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }

  /* формите (мерки, свободен лог, „Изядох") */
  .lf label { display: block; font-weight: 600; font-size: 14px; margin: 10px 0 4px; }
  .lf input, .lf textarea { width: 100%; padding: 10px 11px; font-size: 16px; border: 1px solid var(--border); border-radius: 9px; font-family: inherit; color: var(--ink); background: #fff; }
  .lf textarea { min-height: 110px; resize: vertical; }
  .lf .hint { color: var(--muted); font-size: 13px; margin: 3px 0 0; }
  .lf .row2 { display: flex; gap: 10px; }
  .lf .row2 > div { flex: 1 1 0; min-width: 0; }
  .lf button, .btn { width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; font-weight: 700; color: #fff; background: var(--btn); border: none; border-radius: 10px; cursor: pointer; font-family: inherit; }
  .lf button:active, .btn:active { background: var(--accent-dark); }
  .lf button.ghost { background: #fff; color: var(--accent-dark); border: 1px solid var(--accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .lf .ok { display: none; margin-top: 10px; padding: 10px 12px; background: var(--soft2); border: 1px solid var(--okline); border-radius: 9px; color: var(--accent-dark); font-size: 14px; text-align: center; }
  .lf .ok.show { display: block; }
  .lf .ok.err { background: #fdecec; border-color: #f3c2c2; color: #9a3b3b; }
  .lf details.meas { margin: 8px 0 2px; border-top: 1px solid var(--border); padding-top: 6px; }
  .lf details.meas summary { cursor: pointer; color: var(--accent-dark); font-weight: 600; font-size: 14px; padding: 4px 0; list-style: none; }
  .lf details.meas summary::-webkit-details-marker { display: none; }
  .eat { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
  .eat .er { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .eat .er label { margin: 0; font-size: 14px; font-weight: 600; flex: none; }
  .eat .er input { width: 132px; flex: none; padding: 9px 10px; font-size: 16px; border: 1px solid var(--border); border-radius: 9px; font-family: inherit; background: #fff; color: var(--ink); }
  .eat .er button { flex: 1 1 100%; margin: 0; padding: 12px 10px; white-space: nowrap; }
  .eat .eh { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
  .eat .eok { display: none; margin-top: 8px; font-size: 13.5px; font-weight: 700; color: var(--accent-dark); }
  .eat .eok.show { display: block; }
  .eat .eok.err { color: #9a3b3b; }
  .logitem { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; }
  .logitem:last-child { border-bottom: none; }
  .logitem .tm { color: var(--muted); font-size: 13px; margin-right: 6px; }
  .logitem .wt { color: var(--accent-dark); font-weight: 600; }
  .logitem.ate { color: var(--accent-dark); font-weight: 600; }
  /* логът (модел Victus LogScreen): брояч „N / 21“ → „∞“ · днес отгоре разгънат · миналите дни свити · групи по месеци · ред = час + текст */
  .card.panel > .ch .lcnt { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--soft2); color: var(--accent-dark); font-size: 14px; font-weight: 800; white-space: nowrap; }
  .card.panel > .ch .lcnt.inf { font-size: 19px; line-height: 1.15; padding: 0 11px; }
  /* Т16: линкът е на заглавния ред, преди значката; обяснението се разгъва под реда на цялата ширина (плавно, Т12) */
  .lmrow { display: flex; justify-content: flex-end; margin: 0 0 8px; }   /* Т31: вдясно, над полето */
  .lmrow .lm { flex: none; margin: -6px 0; padding: 6px 0; border: none; background: none; color: var(--accent-dark); font-family: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent-a40); text-underline-offset: 2px; }
  .ltoday { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px 12px 6px; margin: 0 0 12px; }
  .lhead { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; }
  .lhead b { flex: 1 1 auto; min-width: 0; font-size: 16px; }
  .lhead span { color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .lw textarea { min-height: 70px; max-height: 170px; resize: none; overflow-y: auto; line-height: 1.45; }
  /* Т15: час + бутон на един ред — час ~40 %, бутон ~60 %, еднаква височина 42 px (като полето в Разговор), 8 px между тях */
  .lwr { display: flex; align-items: stretch; gap: 8px; margin-top: 8px; }
  .lf .lwr input { flex: 0 0 calc((100% - 8px) * 0.4); min-width: 0; width: auto; height: 42px; margin: 0; padding: 0 10px; font-size: 16px; line-height: normal; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; color: var(--ink); background: #fff; -webkit-appearance: none; appearance: none; }
  .lf .lwr button { flex: 1 1 0; min-width: 0; width: auto; height: 42px; margin: 0; padding: 0 8px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 360px) { .lf .lwr button { padding: 0 4px; font-size: 15px; } }   /* Т39: „Няма записи днес“ на един ред на 320 */
  .lwr span { flex: 1 1 150px; min-width: 0; font-size: 12.5px; color: var(--muted); }
  .lf button.idle:disabled { opacity: 1; background: var(--soft); color: var(--muted); border: 1px solid var(--border); font-size: 14.5px; }
  .lrows { margin-top: 10px; }
  .lrow { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 15px; line-height: 1.45; }
  .lrows .lrow:first-child { border-top: none; }
  .lrow .tm { flex: none; min-width: 40px; padding-top: 1px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .lrow .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .lrow.ate .tx { color: var(--accent-dark); font-weight: 600; }
  .lrow .wt { color: var(--accent-dark); font-weight: 600; }
  /* Т56: „Изядох“ със снимка — час · име · ккал вдясно (в колона); под тях сив ред с храните (под името) */
  .lrow.snap { flex-wrap: wrap; row-gap: 0; }
  .lrow .lk { flex: none; min-width: 4.6em; padding-top: 1px; text-align: right; font-size: 13.5px; font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lrow .lfx { display: inline-flex; flex: none; align-self: flex-start; align-items: center; justify-content: center; box-sizing: border-box; width: 32px; height: 32px; margin: -5px -7px -6px -4px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 20px; font-weight: 800; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* Т70 */
  .lrow .lfx[hidden] { display: inline-flex; visibility: hidden; }
  .lrow .lfx.ro, .mrow .mfb.ro { cursor: not-allowed; }   /* Т91б: изгледите на треньора — видими, изключени (бледи като „Запиши“), без ръка */
  .lrow .lfx svg.ic { width: 20px; height: 20px; }
  .lrow .lfx.on { color: var(--accent-dark); }
  .lrow .lfx:focus { outline: none; }
  .lrow .lfx:focus-visible { border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); }
  .lrow.fixing { flex-wrap: wrap; row-gap: 6px; }
  .lrow textarea.lfix { display: block; width: 100%; box-sizing: border-box; margin: -3px 0; padding: 3px 7px; font-family: inherit; font-size: 16px; line-height: 1.45; color: var(--ink); background: #fff; border: 1px solid var(--accent); border-radius: 8px; resize: none; overflow-y: auto; white-space: pre-wrap; }
  .lrow .lfxe { flex: 0 0 100%; display: block; margin: 0; padding: 8px 10px; border: 1px solid #f3c2c2; border-radius: 9px; background: #fdecec; color: #9a3b3b; font-size: 14px; text-align: center; }
  .lrow .lfd { flex: 0 0 100%; box-sizing: border-box; padding-left: 50px; margin-top: 1px; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.4; overflow-wrap: anywhere; }
  /* Т113: ✎ и 🗑 в една кутия вдясно (като в мерките); 🗑 е най-вдясно на всеки ред (една колона), ✎ — пред него; „Изядох“ — само 🗑.
     „Да изтрия ли?“ [Да] [Не] — на свой ред в реда (Т91). Сборът „Общо днес“ се отмества с колоната на 🗑 → ккал на деня над ккал на „Изядох“. */
  .lrow .lbx { flex: none; display: inline-flex; align-self: flex-start; margin: -5px -7px -6px -4px; }
  .lrow .lbx .lfx { margin: 0; }
  .lrow .ldel { display: inline-flex; flex: none; align-items: center; justify-content: center; box-sizing: border-box; width: 32px; height: 32px; margin: 0; padding: 0; border: 0; background: none; color: var(--muted); font: inherit; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .lrow .ldel[hidden] { display: inline-flex; visibility: hidden; }
  .lrow .ldel.ro { cursor: not-allowed; }
  .lrow .ldel svg.ic { width: 20px; height: 20px; }
  .lrow .ldel:focus { outline: none; }
  .lrow .ldel:focus-visible { border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); }
  .lrow.asking { flex-wrap: wrap; row-gap: 6px; }
  .lrow .mask { flex: 0 0 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 8px; padding-top: 2px; font-weight: 700; }
  .lrow .mask button { width: auto; margin: 0; padding: 6px 16px; font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 9px; cursor: pointer; }
  .lrow .mask .myes { color: #fff; background: var(--btn); border: 1px solid var(--btn); }
  .lrow .mask .mno { color: var(--accent-dark); background: #fff; border: 1px solid var(--accent); }
  /* Т56: сборът на деня (модел ФКУ тракер): ккал горе вдясно; П · В · М на втория ред — всяко в своя колона (цифра под цифра); „+ N без сметка“ вляво */
  .d-kc { text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; white-space: nowrap; color: var(--ink); }
  .d-m { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--accent-dark); }
  /* Т108 (Chris 12.11 10:18): П · В · М — буквата вляво, числото вдясно в клетка с еднаква ширина; сивата „·“ (като в реда с %) е в средата
     на междината → равни разстояния. Колоните са 35/40/41 (В и М — с 4 px за точката), общо пак 126 → ккал, % и останалото не мърдат. */
  .d-m { position: relative; display: flex; justify-content: space-between; align-items: baseline; }
  .d-m b { font-weight: inherit; }
  .d-m.d-c, .d-m.d-f { margin-left: 4px; }
  .d-m.d-c::before, .d-m.d-f::before { content: "·"; position: absolute; right: 100%; top: 0; width: 9px; text-align: center; color: var(--muted); font-weight: 600; }
  .d-nc { min-width: 0; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .d-nc.d-pc { font-size: 11px; font-variant-numeric: tabular-nums; }   /* Т105: макро % — цифра под цифра (едноцифреното — с цифров интервал) */
  @media (max-width: 359px) { .qd-food .d-nc.d-pc { grid-column: 1 / 7; grid-row: 3; } .lsum .d-nc.d-pc { grid-column: 1 / 5; grid-row: 3; } }   /* Т105: тясно — % на свой ред, цял */
  .lsum { display: grid; grid-template-columns: minmax(0, 1fr) 35px 40px 41px; column-gap: 5px; row-gap: 1px; align-items: baseline; padding: 4px 0 8px; border-bottom: 1px solid var(--border); }
  .lsum .ls-l { grid-column: 1; grid-row: 1; font-size: 13px; font-weight: 700; color: var(--accent-dark); }
  .lsum .d-kc { grid-column: 2 / 5; grid-row: 1; }
  .lsum .d-nc { grid-column: 1; grid-row: 2; }
  .lsum .d-p { grid-column: 2; grid-row: 2; } .lsum .d-c { grid-column: 3; grid-row: 2; } .lsum .d-f { grid-column: 4; grid-row: 2; }
  .lrows .lsum + .lrow { border-top: none; }
  .lsum.hb { padding-right: 31px; }   /* Т113: колоната на 🗑 (32 − 7 − 4 + 10) → ккал на деня точно над ккал на „Изядох“ */
  /* Т109 (Chris 11:08 / 11:10): „График“ — вляво в реда на „Защо 21 дни?“ (картата не расте); натискане → балонът с бутоните за ДНЕС;
     след избор надписът е избраното — плътно; огледалото — видим, изключен (.ro), балон не се отваря */
  .lmrow #dtBox { flex: none; margin-right: auto; display: flex; align-items: center; }
  .lmrow .lm.dtb.on { margin: -3px 0; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; }
  .lmrow .lm.dtb.ro { cursor: not-allowed; }
  .dtpop .dtc { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }

  .qd-food > summary > .d-dt { grid-column: 3 / 5; grid-row: 1; }   /* + празното вляво под ккал (ккал е вдясно) — „След нощна“ се събира */
  @media (max-width: 359px) { .qd-food > summary > .d-dt { grid-column: 1 / 4; grid-row: 2; } .qd-food.hdt > summary > .d-nc { grid-column: 1 / 7; grid-row: 3; } }   /* тясно — под датата */
  .lempty { margin: 4px 0 8px; color: var(--muted); font-size: 14px; }

  /* Т11: хронологиите — акордеони в същата страница: карта (като „Анализ") → месеци → дни/дати; по един отворен на ниво */
  .card.panel.hist { margin: 12px 0; }
  /* Т111: „Архив“ — най-долу в Начало, затворен; вътре по-старите версии на картите (затворени, със своята дата, само за четене).
     Празен — само в изгледите на треньора: блед и изключен, „Празно“ (огледалото); ⓘ се отваря. */
  .card.panel.archbox { margin-top: 18px; }

  .card.panel.archbox.ro { opacity: 0.55; }
  .card.panel.archbox.ro > .ch { cursor: not-allowed; }
  .card.panel.archbox .acc .body :disabled { cursor: not-allowed; }
  .card.panel.archbox .acc .body textarea:disabled { background: #f3f5f7; }   /* като изключеното поле във формата */
  .card.panel.hist > .body { padding: 10px 10px 2px; }
  .acc > .card.hm { padding: 0; border-left-width: 3px; margin: 0 0 8px; overflow: hidden; }
  .card.hm > .ch { padding: 12px 14px; font-size: 15px; gap: 8px; }
  .card.hm.open > .ch { border-bottom: 1px solid var(--border); background: var(--soft); }
  .card.hm > .ch .hmt { flex: 1 1 auto; min-width: 0; color: var(--accent-dark); }
  .card.hm > .ch .hsub { flex: none; color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  /* Т106: под заглавието на месеца — средното на ден; колоните — като при деня (ккал под ккал, П под П…), стрелката остава в първия ред */
  .card.hm > .ch.hmx { flex-wrap: wrap; row-gap: 4px; }
  .hm-avg { order: 1; flex: 0 0 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 35px 40px 41px 10px; column-gap: 5px; row-gap: 1px; align-items: baseline; }
  .hm-avg .ma-l { grid-column: 1; grid-row: 1; min-width: 0; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm-avg .d-kc { grid-column: 2 / 5; grid-row: 1; }
  .hm-avg .d-nc { grid-column: 1; grid-row: 2; }
  .hm-avg .d-p { grid-column: 2; grid-row: 2; } .hm-avg .d-c { grid-column: 3; grid-row: 2; } .hm-avg .d-f { grid-column: 4; grid-row: 2; }
  @media (max-width: 359px) { .hm-avg { grid-template-columns: minmax(0, 1fr) 33px 38px 39px 10px; column-gap: 4px; } .hm-avg .d-nc.d-pc { grid-column: 1 / 6; grid-row: 3; } }   /* тясно — % на свой ред, както при деня */
  .card.hm > .body { margin: 0; padding: 8px 8px 0; background: #fafbfc; }
  .acc > details.qacard { margin: 0 0 8px; }
  details.qacard { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--edge); border-radius: 12px; overflow: hidden; }
  details.qacard > summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 16px; min-height: 54px; display: flex; align-items: center; gap: 10px; }
  details.qacard > summary::-webkit-details-marker { display: none; }
  details.qacard > summary::after { content: "▸"; color: var(--accent); font-size: 14px; flex: none; line-height: 1; }
  details.qacard[open] > summary { border-bottom: 1px solid var(--border); }
  details.qacard[open] > summary::after { content: "▾"; }
  details.qacard .qc-t { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--accent-dark); }
  details.qacard .qc-sub { flex: none; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  details.qacard .qc-body { padding: 4px 16px 10px; }
  details.qacard .qc-body .lrows { margin: 0; }
  .dbody { display: flow-root; }
  /* Т32: „Принтирай / запази като PDF“ в анализа */
  .an .anprint { display: block; width: 100%; margin: 14px 0 4px; padding: 13px 16px; border: 1px solid var(--accent); border-radius: 11px; background: #fff; color: var(--accent-dark); font: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer; }
  /* печат изобщо: без нищо закрепено (лентата долу, менюта, резерва на акордеона) */
  @media print {
    nav.tabs, #accSpacer, .lmenu, .cdown, body::before { display: none !important; }
    html, body { background: #fff !important; }
    body { box-shadow: none !important; padding-bottom: 0 !important; }
  }
  /* Т32: печат САМО на анализа (body.print-an, слага се от бутона) */
  @media print {
    @page { size: A4; margin: 14mm 12mm; }
    body.print-an { max-width: none !important; margin: 0 !important; padding: 0 !important; }

    body.print-an #p-hrana > :not(.card.panel[data-key="analysis"]), body.print-an .ndot, body.print-an .tdot, body.print-an .badge,
    body.print-an .anprint, body.print-an .no-print, body.print-an .cert-pop { display: none !important; }
    body.print-an #main { padding: 0 !important; max-width: none !important; }
    body.print-an #p-hrana { display: block !important; }
    body.print-an .card.panel[data-key="analysis"] { border: none !important; margin: 0 !important; box-shadow: none !important; }
    body.print-an .card.panel[data-key="analysis"] > .ch { padding: 0 0 10px !important; background: none !important; border: none !important; font-size: 20px; }
    body.print-an .card.panel[data-key="analysis"] > .ch::after, body.print-an .an .card > .ch::after { display: none !important; }
    body.print-an .card.panel[data-key="analysis"] > .body { padding: 0 !important; background: none !important; display: block !important; height: auto !important; overflow: visible !important; }
    body.print-an .an .card { display: block; break-inside: avoid; page-break-inside: avoid; margin: 0 0 10px; }

  }
  /* Т30: подравняване по запетаята в таблиците */
  .vi { display: inline-block; text-align: right; white-space: nowrap; }
  .vf { display: inline-block; text-align: left; }
  /* Т30: ред-ден — мрежа с фиксирани колони; датата първа (tabular-nums), стойността дясно подравнена, разликата и „от лога“ в свои колони */
  details.qday > summary { display: grid; grid-template-columns: 38px 34px minmax(0, 1fr) auto 10px; align-items: baseline; column-gap: 6px; }
  details.qday.qd-meas > summary { grid-template-columns: 38px 34px minmax(0, 1fr) 58px 40px 50px 10px; column-gap: 5px; }
  details.qday > summary::after { justify-self: end; }
  .d-date { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14.5px; color: var(--accent-dark); white-space: nowrap; }
  .d-wd { color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .d-lab { min-width: 0; text-align: right; color: var(--muted); font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14.5px; white-space: nowrap; color: var(--ink); }
  .d-diff { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 700; white-space: nowrap; color: var(--muted); }
  /* Т46: разликата (стрелката + числото) — нагоре червено, надолу зелено; „=“ остава сиво; стойностите (кг/см) — тъмни */
  .d-diff.dup, .md.dup { color: var(--up); }
  .d-diff.ddown, .md.ddown { color: var(--down); }
  .d-src { white-space: nowrap; overflow: hidden; }
  .d-src .mfrom { font-size: 10.5px; padding: 0 5px; }
  .d-cnt { text-align: right; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* Т56: ден със сбор — два реда в заглавието: [ДД.ММ][ден] … [ккал][▸] / [+ N без сметка] … [П][В][М] */
  details.qday.qd-food > summary { grid-template-columns: 38px 34px minmax(0, 1fr) 35px 40px 41px 10px; column-gap: 5px; row-gap: 1px; }
  .qd-food > summary > .d-date { grid-column: 1; grid-row: 1; } .qd-food > summary > .d-wd { grid-column: 2; grid-row: 1; }
  .qd-food .d-kc { grid-column: 4 / 7; grid-row: 1; }
  .qd-food .d-nc { grid-column: 1 / 4; grid-row: 2; }
  .qd-food .d-p { grid-column: 4; grid-row: 2; } .qd-food .d-c { grid-column: 5; grid-row: 2; } .qd-food .d-f { grid-column: 6; grid-row: 2; }
  details.qday.qd-food > summary::after { grid-column: 7; grid-row: 1; }
  .qs-h .d-date { font-size: 14.5px; margin-right: 2px; }
  .qs-h .d-wd { margin-right: 4px; }
  @media (max-width: 359px) {
    details.qday > summary { grid-template-columns: 36px 31px minmax(0, 1fr) auto 10px; column-gap: 4px; }
    details.qday.qd-meas > summary { grid-template-columns: 36px 31px minmax(0, 1fr) 54px 36px 46px 10px; column-gap: 4px; }
    .d-date { font-size: 13.5px; } .d-wd { font-size: 11.5px; } .d-val { font-size: 13px; } .d-diff { font-size: 11.5px; } .d-src .mfrom { font-size: 9.5px; padding: 0 4px; }
    .qd-meas .d-lab { visibility: hidden; }
    details.qday.qd-food > summary { grid-template-columns: 36px 31px minmax(0, 1fr) 33px 38px 39px 10px; column-gap: 4px; }
    .lsum { grid-template-columns: minmax(0, 1fr) 33px 38px 39px; column-gap: 4px; }
    .d-m.d-c::before, .d-m.d-f::before { width: 8px; }   /* Т108: междината тук е 4 + 4 px */
    .d-kc { font-size: 13px; } .d-m { font-size: 12px; }
  }
  #accSpacer { pointer-events: none; }
  /* Т23: вътре в хронология — леки редове: без рамка и цветна лента, тънка линия между тях; ▸/▾ и плавният цикъл (Т20) остават.
     Хронология, вложена в панел (Изследвания, Промени във формата), също е лек ред — рамката е само на най-външната карта. */
  .card.hist .acc > .card.hm, .card.hist .acc > details.qacard, .card.panel .card.panel.hist {
    border: none; border-top: 1px solid var(--border); border-radius: 0; background: transparent; margin: 0; overflow: visible; }
  .card.hist .acc > :first-child { border-top: none; }
  .card.hist .card.hm > .ch, .card.hist .card.hm.open > .ch, .card.panel .card.panel.hist > .ch, .card.panel .card.panel.hist.open > .ch { padding: 12px 2px; background: none; border-bottom: none; }
  .card.hist .card.hm > .body { margin: 0; padding: 0 0 4px 12px; background: none; }
  .card.hist details.qacard > summary { padding: 10px 2px; min-height: 0; }
  .card.hist details.qacard[open] > summary { border-bottom: none; }
  .card.hist details.qacard .qc-body { padding: 0 2px 10px; }
  .card[data-key="h_labs"] details.qacard .qc-body { padding-left: 14px; }   /* Т112в: без месеците — таблицата на същата ширина като преди (отстъпът на месеца) */
  .card.panel .card.panel.hist { margin: 10px 0 0; }
  .card.panel .card.panel.hist > .body { padding: 0 0 4px 12px; background: none; }
  details.qacard .iold { color: var(--muted); text-decoration: line-through; }
  .qcqa .qa .qi:first-child { margin-top: 8px; }
  .hempty { margin: 0 0 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-size: 14.5px; }

  /* Т55: „Изядох" по data-meal — малък бутон ВЪТРЕ в храненето (без отделен ред). Целта за докосване е 32 px, видимото е хапче 24 px.

  .eatc { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 6px; vertical-align: middle; margin: -4px 0 -4px 2px; }

  /* долната лента — Т34: като във ФКУ тракера (phe-tracker #botnav): плаваща, центрирана (fit-content), не по цялата ширина;

     translateX(i × 100 %) ляга точно върху i-тия; видимият „ръб“ около маркера е само отстъпът на хапчето — 4 px от четирите страни.

    color: #fff; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; transition: color 220ms cubic-bezier(.4,0,.2,1); }

  /* Т37/Т38: размерът на иконите (един за петте; оптичното изравняване на дизайнера остава): Chris избра 40 px (Т38).

     един размер навсякъде. Значката на Разговор вече е точка като другите. */
  nav.tabs .nav-ic svg { width: var(--navic); height: var(--navic); display: block; }
  /* Т41: ЕДИН маркер за петте бутона — в общия контейнер на лентата (слоят е първи в нея, позициониран → над фона на хапчетата,
     които не са позиционирани; бутоните идват след него → иконите и точките са отгоре). Слоят е изрязан по двете хапчета
     (clip-path: path(…) — смята го navClip() от кутиите им) → в процепа маркерът минава „под“ него и не се вижда.

    nav.tabs.k6 button[data-tab="nachalo"] .nav-ic svg { stroke-width: 1.3462; } nav.tabs.k6 button[data-tab="hrana"] .nav-ic svg { stroke-width: 1.3438; } nav.tabs.k6 button[data-tab="kuhnya"] .nav-ic svg { stroke-width: 1.25; } nav.tabs.k6 button[data-tab="merki"] .nav-ic svg { stroke-width: 1.3425; } nav.tabs.k6 button[data-tab="razgovor"] .nav-ic svg { stroke-width: 1.3262; } nav.tabs.k6 button[data-tab="danni"] .nav-ic svg { stroke-width: 1.225; }   /* линията — както при 40 px (Т43) */

  // заглавие, th: златистото „ново“ на Ваня/Поля, едно тюркоазено). Страницата ги пренебрегва: при показване се махат само тези правила
  // (друг <style> остава). Данните не се пипат — затова и отпечатъкът за „ново“ не се сменя.
  var CARD_RULE = /\.card\[data-key=(["']?)[^"'\]]*\1\][^{}]*\{[^{}]*\}/g;
  function plainBody(html) {
    return String(html || "").replace(/<style\b[^>]*>([\s\S]*?)<\/style>/gi, function (m, css) {
      var rest = css.replace(CARD_RULE, "").trim();
      return rest ? m.slice(0, m.indexOf(">") + 1) + rest + "</style>" : "";
    });
  }
  function cardHtml(r, open, extraBody, chip) {
    var key = cardKey(r), sl = seenLine(key);   // Т84б: при треньора — видяно ли е (горе вдясно, свой ред)
    var dt = r.entry_date ? '<span class="cdate">' + esc(fmtDate(r.entry_date)) + "</span>" : "";   // Т111: датата — горе вдясно, в същия ред (вляво от „видяно“)
    return '<div class="card' + (open ? " open" : "") + (sl || dt ? " hasr" : "") + '" data-key="' + esc(key) + '">'
      + (sl || dt ? '<div class="seenrow">' + dt + sl + "</div>" : "")
      + '<div class="ch"><span>' + esc(r.title || "Виж") + dot(key) + "</span>" + (chip || "") + "</div>"
      + '<div class="body">' + plainBody(r.body) + (extraBody || "") + "</div></div>";
  }
  function panelHtml(key, ico, title, sub, inner, open, chip, info) {
    return '<div class="card panel' + (open ? " open" : "") + '" data-key="' + key + '">'
      + '<div class="ch"><span class="ico">' + ic(ico) + '</span><span class="ttl">' + esc(title) + (info ? infoBtn(info) : "") + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "") + "</span>" + (chip || "") + "</div>"
      + '<div class="body">' + inner + "</div></div>";
  }

  // ── Т111: „Архив“ — секция 'arch' (по-старите версии на картите): най-долу в Начало, затворен; вътре — затворени карти със своята дата,
  //   най-скоро преместената горе (archived_at, после датата на картата). Само за четене; без „ново“ и без видяно (не е в D.content).
  //   Празен: при клиента — няма го; в изгледите на треньора (?c= / VIEW_AS) — блед, изключен, „Празно“ (огледалото).
  function archSort(a, b) { return (Date.parse(b.archived_at || "") || 0) - (Date.parse(a.archived_at || "") || 0) || String(b.entry_date || "").localeCompare(String(a.entry_date || "")); }
  function archHtml() {
    var n = ARCH.length, ro = !n && (COACH || VIEW_AS);
    if (!n && !ro) return "";

    return h.replace('<div class="card panel', '<div class="card panel archbox' + (ro ? ' ro" aria-disabled="true' : ""));
  }
  function archRo(root) {   // формите и въпросите в архивните карти — изключени
    Array.prototype.forEach.call(root.querySelectorAll(".archbox .acc .body input, .archbox .acc .body textarea, .archbox .acc .body select, .archbox .acc .body button"), function (x) {
      x.disabled = true; x.setAttribute("aria-disabled", "true"); if (x.tagName === "BUTTON") x.classList.add("ro");   // .ro — само на бутоните (както навсякъде)
    });

  function archGo(k) {   // <a class="arch" data-arch="arch_9001"> в карта → Начало, „Архив“ и тази карта отворени, превъртяно, осветено; непознат ключ → нищо
    k = String(k || "");

  // ════════ НАЧАЛО ════════
  // Т28: последното тегло по слятата поредица на Мерки (ден с мерене в client_log има предимство пред реда от лога)
  function lastWeight() {

    F.entries.forEach(function (e) { if (e.kind !== "coach" && e.weight != null && e.weight !== "") { if (!best || String(e.created_at) > String(best.at)) best = { w: e.weight, at: e.created_at }; } });
    return best;

    D.content.forEach(function (r) {
      if (!isQaCard(r)) return;

    var im = intakeNowRow(); if (im) rows.push(im);   // Т58: формата за данни — липсващите
    var news = D.content.filter(function (r) { return r.section === "info" && /какво е новото/i.test(r.title || "") && r.entry_date; })[0];
    if (news && dayDiff(String(news.entry_date).slice(0, 10), todayStr()) <= 14) rows.push(["plan_updated", "Планът е обновен на " + fmtDate(news.entry_date), "nachalo:" + cardKey(news)]);
    if (anaRowOn()) rows.push(["analysis", "Анализът на храненето ти е готов", "hrana:analysis"]);   // Т93б
    var w = lastWeight();   // Т104: редът за теглото е винаги, и в ден 1 (START) — държи блока „Ново за теб“ (ⓘ + камбанката); „Първи стъпки“ под него — без промяна
    rows.push(w ? ["weight", "Последно тегло: " + num1(w.w) + " кг · " + fmtDate(sofiaDay(w.at)), "merki"] : ["weight", "Още няма записано тегло", "merki"]);

  function startHtml() {

  var NOWK = { message: 1, qa: 1, analysis: 1, plan_updated: 1 };   // Т81: редовете „Ново за теб“, които мигат (до натискане)

    rows.forEach(function (r) { html += '<a data-go="' + esc(r[2]) + '"' + (r[3] ? ' id="' + r[3] + '"' : "") + (NOWK[r[0]] ? ' data-nk="' + esc(r[0] + "|" + r[1]) + '"' : "") + '><span class="i">' + ic(r[0]) + '</span><span class="x">' + esc(r[1]) + "</span></a>"; });

  // ════════ ИНСТАЛИРАНЕ (Т17) ════════
  // Картата е в Начало само ако страницата НЕ е отворена като инсталирано приложение и е на телефон (iPhone/iPad/Android).
  // × я скрива за 14 дни (localStorage). Android/Chrome: бутон през beforeinstallprompt; без него — 2 стъпки през ⋮.
  // iPhone: в Safari — „Сподели“ → „Добави към началния екран“; в друг браузър — „Отвори този линк в Safari“.
  var INST_KEY = "app_install_hidden", INST_DONE = "app_installed", INST_DAYS = 14, instPrompt = null, INST_ENV = null, INST_FORCE = false;
  var SHARE_SVG = ic("share", "shr");
  function pwaEnv() {
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    return {
      standalone: !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true),
      ios: ios,
      // в друг браузър на iPhone „Добави към началния екран“ липсва или не пази линка → към Safari
      iosSafari: ios && /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|YaBrowser|DuckDuckGo|FBAN|FBAV|Instagram|Line\//.test(ua),
      android: /Android/.test(ua),
      prompt: !!instPrompt
    };
  }
  function instHidden() {
    if (lsGet(INST_DONE)) return true;
    var t = +lsGet(INST_KEY) || 0;
    return !!t && Date.now() - t < INST_DAYS * 864e5;
  }
  function installHtml(env) {
    var pv = COACH || VIEW_AS;   // Т96: огледалото — само когато клиентът наистина я вижда (coach_app_state); вариантът — по НЕГОВИЯ телефон
    if (pv) { if (!APP_RO) return ""; env = APP_RO.platform === "ios" ? { ios: true, iosSafari: true } : { android: true, prompt: false }; }   // ios → iPhone; android → Android
    else if (env.standalone || !(env.ios || env.android) || (instHidden() && !INST_FORCE)) return "";   // Т85: INST_FORCE — от балона „Известия“
    var body;
    if (env.ios && !env.iosSafari) body = "<p>Отвори този линк в <b>Safari</b>.</p>";
    else if (env.ios) body = "<ol><li><b>Сподели</b> " + SHARE_SVG + "</li><li><b>„Добави към началния екран“</b></li></ol>";
    else if (env.prompt) body = '<button type="button" class="btn" id="instBtn">Инсталирай</button>';
    else body = "<ol><li><b>⋮</b> горе вдясно</li><li><b>„Инсталирай приложението“</b> или <b>„Добави към началния екран“</b></li></ol>";

      + '<div class="ib">' + body + "</div></div>";
  }
  // Т96: телефонът на клиента казва на базата (тихо, сървърът пише най-много веднъж на 30 мин) дали е от иконата, какъв е и дали е скрил
  //   картата; треньорът (?c= / VIEW_AS) вижда картата само ако клиентът наистина я вижда — known && !installed && !hidden.
  var APP_RO = null;
  function appReport(hidden) {
    if (COACH || VIEW_AS || !CAN_WRITE || !token) return;
    var env = INST_ENV || pwaEnv(), a = { p_token: token, p_standalone: !!env.standalone, p_platform: env.ios ? "ios" : env.android ? "android" : "other" };
    if (hidden) a.p_hidden = true;
    try { Promise.resolve(sb.rpc("report_app_state", a)).then(function () {}, function () {}); } catch (x) {}
  }
  function appRoInit() {
    if (!COACH && !VIEW_AS) return;
    var a = COACH ? (COACH_CID ? { p_client_id: COACH_CID } : null) : token ? { p_token: token } : null;
    if (!a) return;
    try {
      Promise.resolve(sb.rpc("coach_app_state", a)).then(function (res) {
        var d = res && !res.error ? res.data : null;
        APP_RO = d && typeof d === "object" && d.known === true && d.installed === false && !d.hidden_at && (d.platform === "ios" || d.platform === "android") ? d : null;   // Т96б: other / null — на компютър картата я няма
        renderInstall();
      }, function () {});
    } catch (x) {}
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") appReport(false); });
  function renderInstall() {
    var host = document.getElementById("instHost");
    if (host) host.innerHTML = installHtml(INST_ENV ? Object.assign({}, INST_ENV, { prompt: !!instPrompt }) : pwaEnv());   // prompt = дали Chrome е дал beforeinstallprompt
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); instPrompt = e; renderInstall(); });
  window.addEventListener("appinstalled", function () { instPrompt = null; lsSet(INST_DONE, "1"); renderInstall(); });
  function instClick(e) {
    if (COACH || VIEW_AS) return false;   // Т93б: прегледът — без действие
    if (e.target.closest("#instX")) { lsSet(INST_KEY, String(Date.now())); appReport(true); renderInstall(); return true; }   // Т96: и в базата
    if (e.target.closest("#instBtn") && instPrompt) {

      try {
        p.prompt();
        Promise.resolve(p.userChoice).then(function (r) { if (r && r.outcome === "accepted") lsSet(INST_DONE, "1"); renderInstall(); }, function () { renderInstall(); });
      } catch (x) { renderInstall(); }

  // ════════ ИЗВЕСТИЯ (Т85, Chris 07:11–07:44) ════════

  // никога изгледът като клиента и треньорът (телефонът на Chris не се абонира за чужди известия).

  function pushSync() {

      return safe(sb.rpc("is_coach")).then(function (x) { return !!(x && !x.error && x.data === true); });
    });
    Promise.all([
      safe(sb.rpc("get_client_diary", { p_token: token })),
      safe(sb.rpc("get_food_log", { p_token: token })),
      safe(sb.rpc("get_analysis", { p_token: token })),
      safe(sb.rpc("get_client_name", { p_token: token })),
      safe(sb.rpc("get_intake", { p_token: token })),   // няма ли го на живо → грешка → формата е „още не е включена"
      safe(sb.rpc("get_labs", { p_token: token })),     // няма ли го на живо → „Качването ще се включи след обновяване"
      viewerCheck
    ]).then(function (rs) {
      VIEWER = rs[6] === true;
      var lb = rs[5];
      if (lb && !lb.error && lb.data) { LABS.on = true; LABS.uploads = lb.data.uploads || []; LABS.results = lb.data.results || []; }
      var dr = rs[0];
      if (dr.error && !dr.data) { showState("Възникна грешка при зареждането. Опитай по-късно."); return; }
      if (!dr.data) { showState("Линкът е невалиден или вече не е активен."); return; }
      boot(dr.data, rs[1].data, rs[2].data, typeof rs[3].data === "string" ? rs[3].data : dr.data.name, rs[4].error || !rs[4].data ? { error: true } : rs[4].data);
    });
  }
  function boot(diary, food, analysis, nm, intake) {
    D = { name: diary.name || "", content: (diary.content || []).filter(function (r) { return r.section !== "arch"; }), log: diary.log || [] };
    ARCH = (diary.content || []).filter(function (r) { return r.section === "arch"; });   // Т111
    if (!COACH) { SEEN_ON = !!diary.seen_items && typeof diary.seen_items === "object"; SEEN_DB = diary.seen_items || {}; }   // Т84 (при треньора — coachBoot)
    if (food) F = { entries: food.entries || [] };
    if (analysis) A = { cards: analysis.cards || [] };
    nm = nm || D.name;
    DB_SEEN = D.log.some(function (e) { return "read_at" in e; });
    var isDev = /^DEV/.test(String(nm || ""));
    CAN_WRITE = !COACH || SELF_W;   // Т57: всички живи — записва всеки клиент (преди: само DEV); Т75: и треньорът на своя акаунт
    COACH_SELF = !COACH && diary.coach_self === true;   // Т73: липсва ли ключът → false (както досега)
    VIEW_AS = !COACH && VIEWER && !isDev && !COACH_SELF;   // треньорът на това устройство → само за преглед; DEV и своят акаунт (Т73) остават за запис
    if (VIEW_AS) {   // Т29: треньорът гледа страницата на клиента — само за преглед (пазачът е същият като CAN_WRITE)
      CAN_WRITE = false;
      document.getElementById("hdr").classList.add("vas");   // Т45: името — на един ред с „…“
    }
    if (!COACH && VIEWER && QS.get("from")) viewBack(QS.get("from"));   // Т45
    // интейкът: get_intake → {data, updated_at, changes}. Грешка (RPC-то още го няма) → изключен, без гърмене.
    IN.on = !!(intake && !intake.error);
    IN.data = (IN.on && intake.data) || {};
    IN.changes = (IN.on && intake.changes) || [];
    IN.upd = (IN.on && intake.updated_at) || null; IN.fat = (IN.on && intake.field_at) || null;   // Т77б: кога е писана формата / всяко поле (за треньора)
    IN.ro = !IN.on || !CAN_WRITE;   // треньорът: CAN_WRITE е false → само за четене
    TRAIN_ON = !!(intake && !intake.error && intake.training === true);   // Т72: само изрично true; иначе тренировките са скрити
    if (!TRAIN_ON) INFO.intake.b[0] = INFO_INTAKE_NOTR;
    START = !D.content.some(function (r) { return !isQaCard(r) && shownSection(r); });   // Т65: archive_* и непознатите секции не се броят
    D.content.forEach(function (r) { if (isQaCard(r)) { var c = qaCounts(r); if (c.title) qaKeyByTitle[c.title] = cardKey(r); } });
    who.textContent = D.name;
    if (COACH) {
      who.innerHTML = '<button type="button" id="whoBtn" aria-haspopup="menu" aria-expanded="false"><span class="wn">' + esc(D.name) + '</span><span class="ar" aria-hidden="true">' + ic("open") + "</span></button>";
      document.getElementById("whoBtn").addEventListener("click", function (e) { e.stopPropagation(); linkMenu(); });
    }
    computeLastClient();
    loading.style.display = "none";
    trackAll(); seenSync(true);   // Т84: видяното само в паметта на телефона → базата (веднъж, approx)
    renderNachalo(); renderHrana(); renderMerki(); renderDanni(); renderRazgovor();
    alignAll();
    if (COACH && !SELF_W) {   // само за четене: полетата извън чата не се пишат
      Array.prototype.forEach.call(document.querySelectorAll("#p-hrana input, #p-hrana textarea, #p-merki input, #p-danni input"), function (el) { el.disabled = true; });
    }
    shInit();   // Т77
    pushInit();   // Т85
    pushRoInit();   // Т93
    appRoInit(); appReport(false);   // Т96
    kitLoad();   // Т94
    calcLoad();   // Т105
    dtLoad();   // Т107
    if (COACH) swMessages();   // Т88: известията на треньора (coach/sw.js)
    updateBadge(); updateDots();
    pushMissing();   // Т76: „липсват N“ → базата
    var h = (location.hash || "").slice(1);
    if (h && h.indexOf(":") > 0) { switchTab("nachalo"); go(h, true, true); } else switchTab(h || "nachalo");   // Т88: целта от известие (или линк) — картата отворена, наведнъж
    bgRestore();   // Т86: след тихото презареждане — отворените карти и скролът
    setTop();
  }
})();
